<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Car Simulation with Chat</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      /* Global Chat Log styling */
      #chat-log {
        position: absolute;
        bottom: 50px;
        left: 10px;
        width: 300px;
        max-height: 200px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        font-family: monospace;
        font-size: 14px;
        padding: 5px;
        border-radius: 5px;
        z-index: 10;
      }
      /* Chat Input styling */
      #chat-input {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: 300px;
        padding: 5px;
        font-size: 14px;
        display: none;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        z-index: 10;
        background: white;
        color: black;
      }
      /* Floating Chat Message styling */
      .floating-chat {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 2px 5px;
        border-radius: 5px;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
    <!-- Import map for Three.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/",
          "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
  </head>
  <body>
    <!-- Global Chat Log and Input -->
    <div id="chat-log"></div>
    <input id="chat-input" type="text" placeholder="Type your message..." />
    
    <script type="module">
      import * as THREE from 'three';
      import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
      
      // --- Supabase Configuration ---
      const SUPABASE_URL = 'https://skhdesewdziqujemittx.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraGRlc2V3ZHppcXVqZW1pdHR4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0NDc0MTczNCwiZXhwIjoyMDYwMzE3NzM0fQ.kZBOW2U2i7Gkz6dv7_uZ-hBYPxGPY-8s8nt7XhiWSpU';
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
    
      // --- Unique Player ID ---
      let playerId = localStorage.getItem('playerId') || '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('playerId', playerId);
      console.log("Player ID:", playerId);
    
      // --- Chat Elements ---
      const chatLog = document.getElementById('chat-log');
      const chatInput = document.getElementById('chat-input');
      let chatMode = false;
    
      window.addEventListener('keydown', (e) => {
        if (e.key === "Enter" && !chatMode) {
          chatMode = true;
          chatInput.style.display = "block";
          chatInput.focus();
          return;
        }
        if (e.key === "Enter" && chatMode && document.activeElement === chatInput) {
          e.preventDefault();
          const message = chatInput.value.trim();
          if (message !== "") {
            sendMessage(message);
          }
          chatInput.value = "";
          chatInput.blur();
          chatInput.style.display = "none";
          chatMode = false;
        }
        if (chatMode && e.key !== "Enter") {
          e.stopPropagation();
        }
      });
    
      // --- Send Chat Message ---
      async function sendMessage(text) {
        try {
          await supabaseClient.from('messages').insert([{ player_id: playerId, text }]);
        } catch (err) {
          console.error("Failed to send message:", err);
        }
      }
    
      // --- Global Chat Polling ---
      async function fetchMessages() {
        try {
          const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);
          if (error) {
            console.error("Error fetching messages:", error);
            return;
          }
          if (!Array.isArray(data)) return;
          chatLog.innerHTML = data.reverse().map(m => `<div><strong>${m.player_id}</strong>: ${m.text}</div>`).join('');
    
          // Show floating labels for recent messages
          data.forEach(message => {
            const msgTime = new Date(message.created_at).getTime();
            if (Date.now() - msgTime < 5000) {
              showFloatingMessage(message.player_id, message.text);
            }
          });
        } catch (err) {
          console.error("Error in fetchMessages:", err);
        }
      }
      setInterval(fetchMessages, 2000);
    
      // --- Three.js Scene Setup ---
      document.addEventListener("DOMContentLoaded", () => {
        // Initialize scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
    
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    
        // CSS2DRenderer for floating chat messages
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
    
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    
        // Grid and Terrain
        const grid = new THREE.GridHelper(100, 100);
        scene.add(grid);
        
        // WebGL Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
    
        // Load and configure the texture for the ground plane
        const texture = new THREE.TextureLoader().load('/grass.png');
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.repeat.set(12, 12);
    
        const planeMaterial = new THREE.MeshStandardMaterial({ map: texture });
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);
        
        // --- Local Player's Car (Red Cube) ---
        // Create car mesh
        const cubeGeometry = new THREE.BoxGeometry(2, 1, 4);
        const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.y = 1; // Start above ground level
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);
        
        // --- Demo Physics Box ---
        const boxMesh = new THREE.Mesh(
          new THREE.BoxGeometry(2, 2, 2),
          new THREE.MeshStandardMaterial({ color: 0x00ff00 })
        );
        boxMesh.position.set(5, 10, 0);
        boxMesh.castShadow = true;
        boxMesh.receiveShadow = true;
        scene.add(boxMesh);
        
        // --- Additional Scene Object: Ramp ---
        const rampGeometry = new THREE.BoxGeometry(10, 1, 20);
        const rampMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const ramp = new THREE.Mesh(rampGeometry, rampMaterial);
        ramp.position.set(10, 0.5, -20);
        ramp.rotation.x = -Math.PI / 8;
        ramp.castShadow = true;
        ramp.receiveShadow = true;
        scene.add(ramp);
        
        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
    
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048; 
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 500;
        scene.add(directionalLight);
    
        // --- Movement Variables for the Local Player ---
        let keys = {};
        const carSettings = {
          speed: 0,              // Current speed
          maxSpeed: 0.5,         // Maximum speed
          acceleration: 0.01,    // How quickly car speeds up
          braking: 0.02,         // How quickly car slows down
          deceleration: 0.005,   // Natural slowdown
          turnSpeed: 0.03,       // How quickly car turns
          gravity: 0.01,         // Gravity force
          jumpForce: 0.3,        // How high car can jump
          groundLevel: 1,        // Y position of ground
          isGrounded: true,      // Is car on ground?
          velocity: new THREE.Vector3(0, 0, 0)
        };
    
        window.addEventListener('keydown', e => {
          keys[e.key] = true;
          console.log("Key pressed:", e.key); // Debug
        });
        window.addEventListener('keyup', e => keys[e.key] = false);
    
        // --- Remote Players Data ---
        const otherPlayers = {};
    
        // --- Register Local Player in Supabase ---
        async function registerPlayer() {
          try {
            await supabaseClient.from('editors').upsert([{
              player_id: playerId,
              x: cube.position.x,
              y: cube.position.y,
              z: cube.position.z,
              rotation: cube.rotation.y,
            }], { onConflict: ['player_id'] });
          } catch (err) {
            console.error("Error registering player:", err);
          }
        }
    
        // --- Update Local Player State ---
        async function updatePlayerState() {
          try {
            await supabaseClient.from('editors').update({
              x: cube.position.x,
              y: cube.position.y,
              z: cube.position.z,
              rotation: cube.rotation.y,
            }).match({ player_id: playerId });
          } catch (err) {
            console.error("Error updating player state:", err);
          }
        }
    
        // --- Poll Remote Players ---
        async function getPlayersRealtime() {
          try {
            const { data } = await supabaseClient.from('editors').select('*').neq('player_id', playerId);
            if (!Array.isArray(data)) return;
            
            // Track current player IDs to handle removals
            const currentPlayers = new Set();
            
            data.forEach(p => {
              currentPlayers.add(p.player_id);
              let car = otherPlayers[p.player_id];
              
              if (!car) {
                // Create new car mesh
                car = new THREE.Mesh(cubeGeometry, new THREE.MeshStandardMaterial({ color: 0x0000ff }));
                car.position.set(p.x, p.y, p.z);
                car.castShadow = true;
                car.receiveShadow = true;
                car.userData.target = { x: p.x, y: p.y, z: p.z, rotation: p.rotation };
                car.userData.chatLabel = null;
                scene.add(car);
                otherPlayers[p.player_id] = car;
              } else {
                // Update target for smooth interpolation
                car.userData.target = { x: p.x, y: p.y, z: p.z, rotation: p.rotation };
              }
            });
            
            // Remove players that are no longer in the data
            Object.keys(otherPlayers).forEach(id => {
              if (!currentPlayers.has(id)) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
              }
            });
            
          } catch (err) {
            console.error("Error in getPlayersRealtime:", err);
          }
        }
        setInterval(getPlayersRealtime, 50);
    
        // --- Floating Chat Message ---
        function showFloatingMessage(targetPlayerId, message) {
          let car = (targetPlayerId === playerId) ? cube : otherPlayers[targetPlayerId];
          if (!car) return;
          if (car.userData.chatLabel) {
            car.userData.chatLabel.element.innerHTML = message;
            clearTimeout(car.userData.chatLabel.timer);
          } else {
            const div = document.createElement('div');
            div.className = 'floating-chat';
            div.innerHTML = message;
            const labelObject = new CSS2DObject(div);
            labelObject.position.set(0, 2, 0);
            car.add(labelObject);
            car.userData.chatLabel = labelObject;
          }
          car.userData.chatLabel.timer = setTimeout(() => {
            if (car.userData.chatLabel) {
              car.remove(car.userData.chatLabel);
              car.userData.chatLabel = null;
            }
          }, 5000);
        }
        
        // --- Remove Local Player Record on Unload ---
        window.addEventListener('beforeunload', () => {
          supabaseClient.from('editors').delete().match({ player_id: playerId });
        });
    
        // --- Idle Timeout Check ---
        let lastMovementTime = Date.now();
        async function checkIdleTimeout() {
          const now = Date.now();
          const idleTime = now - lastMovementTime;
    
          if (idleTime > 2 * 60 * 1000) { // 2 minutes
            await supabaseClient.from('messages').insert([{
              player_id: playerId,
              text: "was kicked due to inactivity."
            }]);
    
            await supabaseClient.from('editors').delete().match({ player_id: playerId });
            alert("You were kicked due to inactivity.");
            location.reload();
          }
        }
        setInterval(checkIdleTimeout, 10000);
        
        // --- Basic Physics for Demo Box ---
        let boxVelocity = new THREE.Vector3(0, 0, 0);
        
        // --- Unified Animation Loop ---
        let prevTime;
        let lastUpdate = Date.now();
    
        function animate(time) {
          requestAnimationFrame(animate);
          
          const deltaTime = prevTime ? (time - prevTime) / 1000 : 0;
          prevTime = time;
          
          // --- Car Movement (Simplified Physics) ---
          if (!chatMode) {
            // Handle key inputs
            // Forward/backward movement
            if (keys["ArrowUp"] || keys["w"]) {
              carSettings.speed += carSettings.acceleration;
              lastMovementTime = Date.now();
            } else if (keys["ArrowDown"] || keys["s"]) {
              carSettings.speed -= carSettings.acceleration;
              lastMovementTime = Date.now();
            } else {
              // Natural deceleration when no keys pressed
              if (carSettings.speed > 0) {
                carSettings.speed -= carSettings.deceleration;
                if (carSettings.speed < 0) carSettings.speed = 0;
              } else if (carSettings.speed < 0) {
                carSettings.speed += carSettings.deceleration;
                if (carSettings.speed > 0) carSettings.speed = 0;
              }
            }
            
            // Speed limits
            if (carSettings.speed > carSettings.maxSpeed) carSettings.speed = carSettings.maxSpeed;
            if (carSettings.speed < -carSettings.maxSpeed/2) carSettings.speed = -carSettings.maxSpeed/2;
            
            // Turning (only when moving)
            if (Math.abs(carSettings.speed) > 0.01) {
              if (keys["ArrowLeft"] || keys["a"]) {
                cube.rotation.y += carSettings.turnSpeed;
                lastMovementTime = Date.now();
              }
              if (keys["ArrowRight"] || keys["d"]) {
                cube.rotation.y -= carSettings.turnSpeed;
                lastMovementTime = Date.now();
              }
            }
            
            // Apply movement in the direction the car is facing
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), cube.rotation.y);
            direction.multiplyScalar(carSettings.speed);
            
            // Update position based on speed and direction
            cube.position.x += direction.x;
            cube.position.z += direction.z;
            
            // Simple gravity and ground collision
            if (cube.position.y > carSettings.groundLevel) {
              carSettings.velocity.y -= carSettings.gravity;
              cube.position.y += carSettings.velocity.y;
            } else {
              cube.position.y = carSettings.groundLevel;
              carSettings.velocity.y = 0;
              carSettings.isGrounded = true;
            }
            
            // Space to jump (when on ground)
            if ((keys[" "] || keys["Space"]) && carSettings.isGrounded) {
              carSettings.velocity.y = carSettings.jumpForce;
              carSettings.isGrounded = false;
              lastMovementTime = Date.now();
            }
            
            // Simple ramp collision detection (very basic)
            if (cube.position.x > 5 && cube.position.x < 15 && 
                cube.position.z < -10 && cube.position.z > -30) {
              // Calculate height based on position on ramp
              const rampZ = (cube.position.z + 20) / -20; // 0 at start of ramp, 1 at end
              const rampHeight = 1 + rampZ * 2;
              
              if (cube.position.y < rampHeight) {
                cube.position.y = rampHeight;
                carSettings.velocity.y = 0;
                carSettings.isGrounded = true;
              }
            }
          }
          
          // --- Simple physics for demo box ---
          boxVelocity.y -= 0.01; // Gravity
          boxMesh.position.x += boxVelocity.x;
          boxMesh.position.y += boxVelocity.y;
          boxMesh.position.z += boxVelocity.z;
          
          // Ground collision for box
          if (boxMesh.position.y < 1) {
            boxMesh.position.y = 1;
            boxVelocity.y = -boxVelocity.y * 0.5; // Bounce with energy loss
            // Apply friction to horizontal movement
            boxVelocity.x *= 0.9;
            boxVelocity.z *= 0.9;
          }
          
          // --- Camera Follow ---
          // Position camera behind car
          const cameraOffset = new THREE.Vector3(0, 3, 10);
          cameraOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), cube.rotation.y);
          
          camera.position.set(
            cube.position.x + cameraOffset.x,
            cube.position.y + cameraOffset.y,
            cube.position.z + cameraOffset.z
          );
          camera.lookAt(cube.position);
    
          // --- Remote Players Interpolation ---
          Object.values(otherPlayers).forEach(car => {
            const target = car.userData.target;
            if (!target) return;
            car.position.lerp(new THREE.Vector3(target.x, target.y, target.z), 0.1);
            car.rotation.y += (target.rotation - car.rotation.y) * 0.1;
          });
    
          // --- Update Local Player State Every 50ms ---
          if (Date.now() - lastUpdate > 50) {
            updatePlayerState();
            lastUpdate = Date.now();
          }
    
          // --- Render Scene and CSS Labels ---
          renderer.render(scene, camera);
          labelRenderer.render(scene, camera);
        }
        
        // Start everything
        registerPlayer();
        requestAnimationFrame(animate);
      });
    </script>
  </body>
</html>
