<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Car Simulation</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
    </style>
    <!-- Import map for Three.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="chat-log" style="
  position: absolute;
  bottom: 40px;
  left: 10px;
  width: 300px;
  max-height: 200px;
  overflow-y: auto;
  background: rgba(0,0,0,0.5);
  color: white;
  font-family: monospace;
  font-size: 14px;
  padding: 5px;
  border-radius: 5px;
  z-index: 10;"></div>

<input id="chat-input" type="text" placeholder="Type your message..." style="
  position: absolute;
  bottom: 10px;
  left: 10px;
  width: 300px;
  padding: 5px;
  font-size: 14px;
  display: none;
  z-index: 10;
  border-radius: 5px;
  border: none;
  outline: none;" />

    <!-- Do not include the UMD version of supabase-js -->
    <script type="module">
      import * as THREE from 'three';
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

      // Supabase configuration
      const SUPABASE_URL = 'https://skhdesewdziqujemittx.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraGRlc2V3ZHppcXVqZW1pdHR4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0NDc0MTczNCwiZXhwIjoyMDYwMzE3NzM0fQ.kZBOW2U2i7Gkz6dv7_uZ-hBYPxGPY-8s8nt7XhiWSpU';

      // Initialize Supabase client using the module version
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

      // Generate a unique player ID as a string and save in localStorage
      let playerId = localStorage.getItem('playerId') || '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('playerId', playerId);
      console.log("Player ID:", playerId);

      document.addEventListener("DOMContentLoaded", () => {
        console.log("DOM loaded. Starting application...");

        try {
          // Three.js scene setup
          const scene = new THREE.Scene();
          scene.background = new THREE.Color(0x87ceeb); // Sky blue

          const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
          const renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          document.body.appendChild(renderer.domElement);

          window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
          });

          // Add grid and plane
          const grid = new THREE.GridHelper(100, 100);
          scene.add(grid);

          const planeGeometry = new THREE.PlaneGeometry(100, 100);
          const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
          const plane = new THREE.Mesh(planeGeometry, planeMaterial);
          plane.rotation.x = -Math.PI / 2;
          scene.add(plane);

          // Local player's car (red cube)
          const cubeGeometry = new THREE.BoxGeometry(2, 1, 4);
          const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
          const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
          cube.position.y = 0.5;
          scene.add(cube);

          // Lighting
          const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
          scene.add(ambientLight);
          const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
          directionalLight.position.set(10, 20, 10);
          scene.add(directionalLight);

          // Initial camera positioning
          camera.position.set(0, 10, 15);
          camera.lookAt(0, 0, 0);

          // Movement variables for local player
          let keys = {};
          let velocity = 0;
          const acceleration = 0.01;
          const maxSpeed = 0.5;
          const friction = 0.98;
          let turnVelocity = 0;
          const turnAcceleration = 0.002;
          const turnFriction = 0.9;
          const maxTurnSpeed = 0.05;

          window.addEventListener('keydown', (e) => { keys[e.key] = true; });
          window.addEventListener('keyup', (e) => { keys[e.key] = false; });

          // Object to store remote players’ cubes
          const otherPlayers = {};

          // Register the local player using player_id (a text column in Supabase)
          async function registerPlayer() {
            try {
              const { error } = await supabaseClient
                .from('editors')
                .upsert([{
                  player_id: playerId,
                  x: cube.position.x,
                  y: cube.position.y,
                  z: cube.position.z,
                  rotation: cube.rotation.y,
                }], { onConflict: ['player_id'] });
              if (error) {
                console.error("Error registering player:", error);
              } else {
                console.log("Player registered/updated.");
              }
            } catch (err) {
              console.error("Error in registerPlayer:", err);
            }
          }

          // Update the local player's state in the database
          async function updatePlayerState() {
            try {
              const { error } = await supabaseClient
                .from('editors')
                .update({
                  x: cube.position.x,
                  y: cube.position.y,
                  z: cube.position.z,
                  rotation: cube.rotation.y,
                })
                .match({ player_id: playerId });
              if (error) {
                console.error("Error updating player state:", error);
              } else {
                console.log("Player state updated.");
              }
            } catch (err) {
              console.error("Error in updatePlayerState:", err);
            }
          }

          // Polling function to fetch remote players (excluding the local player)
          async function getPlayersRealtime() {
            try {
              const { data, error } = await supabaseClient
                .from('editors')
                .select('*')
                .neq('player_id', playerId)
                .limit(10);
              if (error) {
                console.error("Error fetching players:", error);
                return;
              }

              data.forEach((changedPlayer) => {
                if (!otherPlayers[changedPlayer.player_id]) {
                  // Create a new cube for the remote player (blue cube)
                  const otherCar = new THREE.Mesh(
                    cubeGeometry,
                    new THREE.MeshStandardMaterial({ color: 0x0000ff })
                  );
                  otherCar.position.set(changedPlayer.x, changedPlayer.y, changedPlayer.z);
                  otherCar.rotation.y = changedPlayer.rotation;
                  scene.add(otherCar);
                  otherPlayers[changedPlayer.player_id] = otherCar;
                  console.log("Added new remote player:", changedPlayer.player_id);
                } else {
                  // Update the position/rotation of the existing remote player's cube
                  const otherCar = otherPlayers[changedPlayer.player_id];
                  otherCar.position.set(changedPlayer.x, changedPlayer.y, changedPlayer.z);
                  otherCar.rotation.y = changedPlayer.rotation;
                }
              });
            } catch (err) {
              console.error("Error in getPlayersRealtime:", err);
            }
          }


          setInterval(getPlayersRealtime, 50);

          // Remove the local player's record on unload
          window.addEventListener('beforeunload', async () => {
            try {
              await supabaseClient
                .from('editors')
                .delete()
                .match({ player_id: playerId });
            } catch (err) {
              console.error("Error deleting player:", err);
            }
          });

          // Animation loop for moving the local player's car and updating state
          let lastUpdate = Date.now();
          function animate() {
            requestAnimationFrame(animate);

            if (keys["ArrowUp"]) velocity -= acceleration;
            if (keys["ArrowDown"]) velocity += acceleration;
            velocity = Math.max(-maxSpeed, Math.min(maxSpeed, velocity));
            velocity *= friction;

            if (keys["ArrowRight"]) {
              turnVelocity += turnAcceleration;
            } else if (keys["ArrowLeft"]) {
              turnVelocity -= turnAcceleration;
            } else {
              turnVelocity *= turnFriction;
            }
            turnVelocity = Math.max(-maxTurnSpeed, Math.min(maxTurnSpeed, turnVelocity));

            if (Math.abs(velocity) > 0.001) {
              cube.rotation.y += turnVelocity * (velocity < 0 ? -1 : 1);
            }
            cube.translateZ(velocity);

            // Make the camera follow the car
            camera.position.x = cube.position.x + Math.sin(cube.rotation.y) * 10;
            camera.position.z = cube.position.z + Math.cos(cube.rotation.y) * 10;
            camera.position.y = cube.position.y + 5;
            camera.lookAt(cube.position);

            // Update player state every 100ms
            if (Date.now() - lastUpdate > 50) {
             updatePlayerState();
              lastUpdate = Date.now();
            }

            renderer.render(scene, camera);
          }

          registerPlayer();
          animate();

        } catch (err) {
          console.error("Error in main application logic:", err);
        }
      });
      // Chat Elements
const chatLog = document.getElementById('chat-log');
const chatInput = document.getElementById('chat-input');
let chatMode = false;

// Submit message
chatInput.addEventListener('keydown', async (e) => {
  if (e.key === "Enter" && chatInput.value.trim() !== "") {
    const message = chatInput.value.trim();
    chatInput.value = "";
    chatMode = false;
    chatInput.style.display = "none";
    try {
      await supabaseClient.from('messages').insert([
        { player_id: playerId, text: message }
      ]);
    } catch (err) {
      console.error("Failed to send message:", err);
    }
  }
});

// Toggle chat with Enter key
window.addEventListener('keydown', (e) => {
  if (e.key === "Enter" && !chatMode) {
    chatMode = true;
    chatInput.style.display = "block";
    chatInput.focus();
  } else if (e.key === "Enter" && chatMode) {
    // Prevent camera input during chat
    e.stopPropagation();
  }

  if (chatMode) {
    e.preventDefault();
    keys = {}; // Cancel movement while typing
  }
});

// Fetch messages every 2s
async function fetchMessages() {
  try {
    const { data, error } = await supabaseClient
      .from('messages')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(20);

    if (error) {
      console.error("Error fetching messages:", error);
      return;
    }

    chatLog.innerHTML = data.reverse().map(m => 
      `<div><strong>${m.player_id}</strong>: ${m.text}</div>`).join('');
  } catch (err) {
    console.error("Error fetching chat:", err);
  }
}
setInterval(fetchMessages, 2000);

    </script>
  </body>
</html>
