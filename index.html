<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Car Simulation with Chat</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      /* Global Chat Log styling */
      #chat-log {
        position: absolute;
        bottom: 50px;
        left: 10px;
        width: 300px;
        max-height: 200px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        font-family: monospace;
        font-size: 14px;
        padding: 5px;
        border-radius: 5px;
        z-index: 10;
      }
      /* Chat Input styling */
      #chat-input {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: 300px;
        padding: 5px;
        font-size: 14px;
        display: none;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        z-index: 10;
        background: white;
        color: black;
      }
      /* Floating Chat Message styling */
      .floating-chat {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 2px 5px;
        border-radius: 5px;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
    <!-- Import map for Three.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
        }
      }
    </script>
    
  </head>
  <body>
    <!-- Global Chat Log and Input -->
    <div id="chat-log"></div>
    <input id="chat-input" type="text" placeholder="Type your message..." />
    
    <script type="module">
import React, { useEffect, useRef, useState } from 'react';
import * as THREE from 'three';
import { createClient } from '@supabase/supabase-js';
import { v4 as uuidv4 } from 'uuid';

// Note: In a real implementation, you would need to install:
// npm install three @supabase/supabase-js uuid

// This is a simplified version for demonstration purposes
const MultiplayerCarGame = () => {
  const mountRef = useRef(null);
  const sceneRef = useRef(null);
  const cameraRef = useRef(null);
  const rendererRef = useRef(null);
  const playerIdRef = useRef(uuidv4());
  const carsRef = useRef({});
  const controlsRef = useRef({
    forward: false,
    backward: false,
    left: false,
    right: false,
  });
  
  const [gameState, setGameState] = useState({
    connected: false,
    players: 0,
  });



  // Initialize Supabase client (replace with your own Supabase URL and anon key)
  const supabase = createClient(
    'https://skhdesewdziqujemittx.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraGRlc2V3ZHppcXVqZW1pdHR4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0NDc0MTczNCwiZXhwIjoyMDYwMzE3NzM0fQ.kZBOW2U2i7Gkz6dv7_uZ-hBYPxGPY-8s8nt7XhiWSpU'
  );

  // Game initialization
  useEffect(() => {
    // Set up Three.js scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75, 
      window.innerWidth / window.innerHeight, 
      0.1, 
      1000
    );
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x87ceeb); // Sky blue background
    mountRef.current.appendChild(renderer.domElement);
    
    // Set up camera position
    camera.position.set(0, 10, 20);
    camera.lookAt(0, 0, 0);
    
    // Add lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(200, 500, 300);
    scene.add(directionalLight);
    
    // Create ground
    const groundGeometry = new THREE.PlaneGeometry(100, 100);
    const groundMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x1e824c,  // Green color
      side: THREE.DoubleSide,
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    
    // Add track/road
    const roadGeometry = new THREE.PlaneGeometry(20, 100);
    const roadMaterial = new THREE.MeshStandardMaterial({ 
      color: 0x333333,  // Dark gray
      side: THREE.DoubleSide,
    });
    const road = new THREE.Mesh(roadGeometry, roadMaterial);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.01; // Slightly above ground to prevent z-fighting
    scene.add(road);
    
    // Store refs for later use
    sceneRef.current = scene;
    cameraRef.current = camera;
    rendererRef.current = renderer;
    
    // Add the player's car
    addCar(playerIdRef.current, 0, 0.5, 0, 0xff0000); // Red car for player
    
    // Handle window resize
    const handleResize = () => {
      if (cameraRef.current && rendererRef.current) {
        cameraRef.current.aspect = window.innerWidth / window.innerHeight;
        cameraRef.current.updateProjectionMatrix();
        rendererRef.current.setSize(window.innerWidth, window.innerHeight);
      }
    };
    
    window.addEventListener('resize', handleResize);
    
    // Set up keyboard controls
    const handleKeyDown = (e) => {
      switch (e.key) {
        case 'ArrowUp':
          controlsRef.current.forward = true;
          break;
        case 'ArrowDown':
          controlsRef.current.backward = true;
          break;
        case 'ArrowLeft':
          controlsRef.current.left = true;
          break;
        case 'ArrowRight':
          controlsRef.current.right = true;
          break;
      }
    };
    
    const handleKeyUp = (e) => {
      switch (e.key) {
        case 'ArrowUp':
          controlsRef.current.forward = false;
          break;
        case 'ArrowDown':
          controlsRef.current.backward = false;
          break;
        case 'ArrowLeft':
          controlsRef.current.left = false;
          break;
        case 'ArrowRight':
          controlsRef.current.right = false;
          break;
      }
    };
    
    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);
    
    // Initialize animation loop
    const animate = () => {
      requestAnimationFrame(animate);
      
      // Update player car position based on controls
      updatePlayerCar();
      
      // Update camera to follow player's car
      updateCameraPosition();
      
      // Render scene
      rendererRef.current.render(sceneRef.current, cameraRef.current);
    };
    
    animate();
    
    // Clean up
    return () => {
      window.removeEventListener('resize', handleResize);
      window.removeEventListener('keydown', handleKeyDown);
      window.removeEventListener('keyup', handleKeyUp);
      if (mountRef.current && rendererRef.current) {
        mountRef.current.removeChild(rendererRef.current.domElement);
      }
      
      // Cleanup Supabase subscriptions would go here
    };
  }, []);

  // Set up Supabase realtime subscriptions for multiplayer
  useEffect(() => {
    // Connect to Supabase and set up player presence
    const setupMultiplayer = async () => {
      try {
        // First, fetch existing players to add them to the scene
        const { data: existingPlayers } = await supabase
          .from('car_positions')
          .select('id, player_id, x, y, z, rotation')
          .neq('player_id', playerIdRef.current);
        
        // Add existing players to the scene
        if (existingPlayers) {
          existingPlayers.forEach(player => {
            addCar(player.player_id, player.x, player.y, player.z, 0x0000ff); // Blue cars for other players
          });
          
          setGameState(prev => ({ ...prev, players: existingPlayers.length + 1 })); // +1 for the current player
        }
        
        // Create or update player position in the database
        const { data, error } = await supabase
          .from('car_positions')
          .upsert({
            player_id: playerIdRef.current,
            x: 0,
            y: 0.5,
            z: 0,
            rotation: 0,
          }, {
            onConflict: 'player_id'
          });
        
        if (error) throw error;
        
        // Subscribe to changes in the car_positions table
        const subscription = supabase
          .channel('car_positions_changes')
          .on('postgres_changes', { 
            event: '*', 
            schema: 'public', 
            table: 'car_positions' 
          }, payload => {
            // Handle different database events
            switch (payload.eventType) {
              case 'INSERT':
                // New player joined
                if (payload.new.player_id !== playerIdRef.current && !carsRef.current[payload.new.player_id]) {
                  addCar(payload.new.player_id, payload.new.x, payload.new.y, payload.new.z, 0x0000ff);
                  setGameState(prev => ({ ...prev, players: prev.players + 1 }));
                }
                break;
              case 'UPDATE':
                // Player position updated
                if (payload.new.player_id !== playerIdRef.current) {
                  updateCarPosition(payload.new.player_id, payload.new.x, payload.new.y, payload.new.z, payload.new.rotation);
                }
                break;
              case 'DELETE':
                // Player left
                if (payload.old.player_id !== playerIdRef.current) {
                  removeCar(payload.old.player_id);
                  setGameState(prev => ({ ...prev, players: Math.max(0, prev.players - 1) }));
                }
                break;
            }
          })
          .subscribe();
          
        // Set up periodic position updates
        const updateInterval = setInterval(async () => {
          if (carsRef.current[playerIdRef.current]) {
            const car = carsRef.current[playerIdRef.current];
            const { error } = await supabase
              .from('car_positions')
              .upsert({
                player_id: playerIdRef.current,
                x: car.position.x,
                y: car.position.y,
                z: car.position.z,
                rotation: car.rotation.y,
              }, {
                onConflict: 'player_id'
              });
              
            if (error) console.error('Error updating position:', error);
          }
        }, 100); // Update every 100ms
        
        // Mark as connected
        setGameState(prev => ({ ...prev, connected: true }));
        
        // Clean up function
        return () => {
          if (subscription) subscription.unsubscribe();
          clearInterval(updateInterval);
          
          // Remove player from the game when disconnecting
          supabase
            .from('car_positions')
            .delete()
            .eq('player_id', playerIdRef.current)
            .then(() => console.log('Player removed from the game'))
            .catch(err => console.error('Error removing player:', err));
        };
      } catch (error) {
        console.error('Error setting up multiplayer:', error);
      }
    };
    
    setupMultiplayer();
  }, []);

  // Function to add a car to the scene
  const addCar = (id, x, y, z, color) => {
    if (!sceneRef.current) return;
    
    // Create a car body
    const carGroup = new THREE.Group();
    
    // Car body
    const bodyGeometry = new THREE.BoxGeometry(2, 1, 4);
    const bodyMaterial = new THREE.MeshStandardMaterial({ color });
    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    carGroup.add(body);
    
    // Car top
    const topGeometry = new THREE.BoxGeometry(1.5, 0.8, 2);
    const topMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const top = new THREE.Mesh(topGeometry, topMaterial);
    top.position.set(0, 0.9, -0.5);
    carGroup.add(top);
    
    // Wheels
    const wheelGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.3, 16);
    const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
    
    const wheels = [
      { x: -1, y: -0.3, z: -1.2 },
      { x: 1, y: -0.3, z: -1.2 },
      { x: -1, y: -0.3, z: 1.2 },
      { x: 1, y: -0.3, z: 1.2 },
    ];
    
    wheels.forEach(pos => {
      const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(pos.x, pos.y, pos.z);
      carGroup.add(wheel);
    });
    
    // Position the car
    carGroup.position.set(x, y, z);
    
    // Add to scene and store reference
    sceneRef.current.add(carGroup);
    carsRef.current[id] = carGroup;
    
    // If this is the player's car, set up physics properties (simplified)
    if (id === playerIdRef.current) {
      carGroup.userData = {
        velocity: new THREE.Vector3(0, 0, 0),
        speed: 0,
        turnSpeed: 0,
        maxSpeed: 0.2,
        acceleration: 0.005,
        deceleration: 0.003,
        turnAcceleration: 0.003,
        maxTurnSpeed: 0.03,
      };
    }
  };
  
  // Remove a car from the scene
  const removeCar = (id) => {
    if (carsRef.current[id] && sceneRef.current) {
      sceneRef.current.remove(carsRef.current[id]);
      delete carsRef.current[id];
    }
  };
  
  // Update another player's car position
  const updateCarPosition = (id, x, y, z, rotation) => {
    if (carsRef.current[id]) {
      // Smooth transition to new position
      const car = carsRef.current[id];
      // For simplicity, just setting position directly
      car.position.set(x, y, z);
      car.rotation.y = rotation;
    } else {
      // If the car doesn't exist yet, add it
      addCar(id, x, y, z, 0x0000ff);
    }
  };
  
  // Update player's car based on controls
  const updatePlayerCar = () => {
    const car = carsRef.current[playerIdRef.current];
    if (!car) return;
    
    const userData = car.userData;
    
    // Apply acceleration/deceleration
    if (controlsRef.current.forward) {
      userData.speed += userData.acceleration;
      if (userData.speed > userData.maxSpeed) userData.speed = userData.maxSpeed;
    } else if (controlsRef.current.backward) {
      userData.speed -= userData.acceleration;
      if (userData.speed < -userData.maxSpeed / 1.5) userData.speed = -userData.maxSpeed / 1.5;
    } else {
      // Apply friction/deceleration
      if (Math.abs(userData.speed) < userData.deceleration) {
        userData.speed = 0;
      } else if (userData.speed > 0) {
        userData.speed -= userData.deceleration;
      } else {
        userData.speed += userData.deceleration;
      }
    }
    
    // Apply turning
    if (controlsRef.current.left) {
      userData.turnSpeed += userData.turnAcceleration;
      if (userData.turnSpeed > userData.maxTurnSpeed) userData.turnSpeed = userData.maxTurnSpeed;
    } else if (controlsRef.current.right) {
      userData.turnSpeed -= userData.turnAcceleration;
      if (userData.turnSpeed < -userData.maxTurnSpeed) userData.turnSpeed = -userData.maxTurnSpeed;
    } else {
      // Return to straight
      if (Math.abs(userData.turnSpeed) < userData.turnAcceleration) {
        userData.turnSpeed = 0;
      } else if (userData.turnSpeed > 0) {
        userData.turnSpeed -= userData.turnAcceleration / 2;
      } else {
        userData.turnSpeed += userData.turnAcceleration / 2;
      }
    }
    
    // Only turn if the car is moving
    if (Math.abs(userData.speed) > 0.01) {
      car.rotation.y += userData.turnSpeed * (userData.speed > 0 ? 1 : -1);
    }
    
    // Update position based on speed and direction
    const direction = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), car.rotation.y);
    car.position.add(direction.multiplyScalar(userData.speed));
    
    // Simple boundary check to keep car on the track
    if (Math.abs(car.position.x) > 45) {
      car.position.x = Math.sign(car.position.x) * 45;
    }
    if (Math.abs(car.position.z) > 45) {
      car.position.z = Math.sign(car.position.z) * 45;
    }
  };
  
  // Update camera to follow player's car
  const updateCameraPosition = () => {
    const car = carsRef.current[playerIdRef.current];
    if (!car || !cameraRef.current) return;
    
    // Camera follows from behind and above
    const cameraOffset = new THREE.Vector3(0, 7, -10);
    cameraOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), car.rotation.y);
    
    cameraRef.current.position.copy(car.position).add(cameraOffset);
    cameraRef.current.lookAt(car.position);
  };

  return (
    <div className="game-container" ref={mountRef} style={{ width: '100%', height: '100vh' }}>
      {!gameState.connected && (
        <div className="loading-overlay" style={{
          position: 'absolute',
          top: 0,
          left: 0,
          width: '100%',
          height: '100%',
          backgroundColor: 'rgba(0,0,0,0.7)',
          color: 'white',
          display: 'flex',
          justifyContent: 'center',
          alignItems: 'center',
          zIndex: 10
        }}>
          <div className="loading-text">
            Connecting to game server...
          </div>
        </div>
      )}
      
      <div className="game-ui" style={{
        position: 'absolute',
        top: 10,
        left: 10,
        padding: '10px',
        backgroundColor: 'rgba(0,0,0,0.5)',
        color: 'white',
        borderRadius: '5px'
      }}>
        <div>Players online: {gameState.players}</div>
        <div style={{ marginTop: '5px' }}>
          Controls: Arrow keys to drive
        </div>
      </div>
    </div>
  );
};

export default MultiplayerCarGame;
    </script>
  </body>
</html>
