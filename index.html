<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stanley AI Voice Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .controls {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #recordButton.recording {
            background-color: #e74c3c;
        }
        .status {
            text-align: center;
            font-style: italic;
            margin-bottom: 20px;
            height: 20px;
        }
        .transcript, .response {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 5px;
        }
        .transcript {
            background-color: #edf8ff;
            border-left: 4px solid #3498db;
        }
        .response {
            background-color: #f0f9f0;
            border-left: 4px solid #2ecc71;
        }
        .conversation {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
        }
        .settings {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .settings h3 {
            margin-top: 0;
        }
        .settings label {
            display: block;
            margin: 10px 0 5px;
        }
        .settings input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .voice-settings {
            margin-top: 10px;
        }
        .voice-settings label {
            display: inline-block;
            margin-right: 10px;
        }
        .voice-settings input {
            width: auto;
            margin-right: 20px;
        }
        /* Audio effect sliders */
        .audio-effects {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
        }
        .audio-effects h4 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        .slider-container {
            margin-bottom: 10px;
        }
        .slider-container label {
            display: inline-block;
            width: 120px;
        }
        .slider-container input {
            width: 200px;
            display: inline-block;
        }
        .slider-value {
            display: inline-block;
            width: 40px;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stanley AI Voice Assistant</h1>
        
        <div class="controls">
            <button id="recordButton">Record (5s)</button>
            <button id="speakButton" disabled>Speak Response</button>
        </div>
        
        <div class="status" id="status"></div>
        
        <div class="conversation" id="conversation"></div>
        
        <div class="settings">
            <h3>Settings</h3>
            <label for="apiKey">Groq API Key:</label>
            <input type="password" id="apiKey" placeholder="Enter your Groq API Key">
            
            <div class="voice-settings">
                <h4>Voice Settings</h4>
                <div class="slider-container">
                    <label for="rateSlider">Rate:</label>
                    <input type="range" id="rateSlider" min="0.5" max="1.0" step="0.1" value="0.8">
                    <span id="rateValue" class="slider-value">0.8</span>
                </div>
                <div class="slider-container">
                    <label for="pitchSlider">Pitch:</label>
                    <input type="range" id="pitchSlider" min="0.5" max="1.5" step="0.1" value="0.9">
                    <span id="pitchValue" class="slider-value">0.9</span>
                </div>
            </div>
            
            <div class="audio-effects">
                <h4>Robotic Voice Effects</h4>
                <div class="checkbox-container">
                    <input type="checkbox" id="chopEffect" checked>
                    <label for="chopEffect">Word Chopping Effect</label>
                </div>
                <div class="checkbox-container">
                    <input type="checkbox" id="pauseEffect" checked>
                    <label for="pauseEffect">Robotic Pauses</label>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM elements
        const recordButton = document.getElementById('recordButton');
        const speakButton = document.getElementById('speakButton');
        const statusElement = document.getElementById('status');
        const conversationElement = document.getElementById('conversation');
        const apiKeyInput = document.getElementById('apiKey');
        
        // Voice effect controls
        const rateSlider = document.getElementById('rateSlider');
        const pitchSlider = document.getElementById('pitchSlider');
        const rateValue = document.getElementById('rateValue');
        const pitchValue = document.getElementById('pitchValue');
        const chopEffect = document.getElementById('chopEffect');
        const pauseEffect = document.getElementById('pauseEffect');
        
        // Update slider value displays
        rateSlider.addEventListener('input', () => {
            rateValue.textContent = rateSlider.value;
        });
        
        pitchSlider.addEventListener('input', () => {
            pitchValue.textContent = pitchSlider.value;
        });
        
        // Memory storage
        let memory = [];
        
        // Audio recording variables
        let mediaRecorder;
        let audioChunks = [];
        let recordingTimeout;
        
        // Speech synthesis
        const synth = window.speechSynthesis;
        let googleVoice = null;
        
        // Initialize voices and find Google US English voice
        function initVoices() {
            return new Promise((resolve) => {
                // Chrome loads voices asynchronously
                const checkVoices = () => {
                    const voices = synth.getVoices();
                    if (voices.length) {
                        // Find Google US English voice
                        googleVoice = voices.find(voice => 
                            voice.name.includes('Google US English') || 
                            (voice.name.includes('Google') && voice.lang === 'en-US')
                        );
                        
                        // Log found voice
                        if (googleVoice) {
                            console.log("Found Google voice:", googleVoice.name);
                        } else {
                            console.log("Google US English voice not found, will use default voice");
                        }
                        
                        resolve(voices);
                        return;
                    }
                    
                    setTimeout(checkVoices, 100);
                };
                
                if (synth.getVoices().length) {
                    checkVoices();
                } else {
                    synth.onvoiceschanged = checkVoices;
                }
            });
        }
        
        // Log available voices to console for debugging
        function logAvailableVoices() {
            const voices = synth.getVoices();
            console.log("Available voices:", voices.length);
            voices.forEach((voice, index) => {
                console.log(`${index}: ${voice.name} (${voice.lang})${voice.default ? ' - DEFAULT' : ''}`);
            });
        }
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await initVoices();
            logAvailableVoices();
        });
        
        // Check for browser support
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            statusElement.innerText = "Your browser doesn't support audio recording.";
            recordButton.disabled = true;
        }
        
        // Check for API key in local storage
        if (localStorage.getItem('groqApiKey')) {
            apiKeyInput.value = localStorage.getItem('groqApiKey');
        }
        
        // Save API key when changed
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('groqApiKey', apiKeyInput.value);
        });
        
        // Record button event listener
        recordButton.addEventListener('click', async () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording();
            } else {
                await startRecording();
            }
        });
        
        // Speak button event listener
        speakButton.addEventListener('click', () => {
            if (memory.length > 0) {
                const lastResponse = memory[memory.length - 1].aiResponse;
                speakText(lastResponse);
            }
        });
        
        // Start recording function
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.addEventListener('dataavailable', event => {
                    audioChunks.push(event.data);
                });
                
                mediaRecorder.addEventListener('stop', async () => {
                    recordButton.classList.remove('recording');
                    recordButton.innerText = 'Record (5s)';
                    
                    statusElement.innerText = "Processing audio...";
                    
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await processAudio(audioBlob);
                });
                
                mediaRecorder.start();
                recordButton.classList.add('recording');
                recordButton.innerText = 'Recording...';
                statusElement.innerText = "🎙️ Recording... (5s)";
                
                // Auto-stop after 5 seconds
                recordingTimeout = setTimeout(() => {
                    if (mediaRecorder.state === 'recording') {
                        stopRecording();
                    }
                }, 5000);
                
            } catch (error) {
                console.error('Error accessing microphone:', error);
                statusElement.innerText = "Error accessing microphone. Please check permissions.";
            }
        }
        
        // Stop recording function
        function stopRecording() {
            clearTimeout(recordingTimeout);
            if (mediaRecorder) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }
        
        // Process audio function
        async function processAudio(audioBlob) {
            const apiKey = apiKeyInput.value;
            if (!apiKey) {
                statusElement.innerText = "Please enter your Groq API Key in settings.";
                return;
            }
            
            try {
                // Transcribe audio using Groq API
                statusElement.innerText = "Transcribing audio...";
                const transcription = await transcribeAudio(audioBlob, apiKey);
                
                // Update UI with transcription
                addToConversation('transcript', transcription);
                statusElement.innerText = "Generating response...";
                
                // Generate AI response
                const aiResponse = await generateResponse(transcription, apiKey);
                
                // Update UI with AI response
                addToConversation('response', aiResponse);
                
                // Add to memory
                memory.push({ userInput: transcription, aiResponse: aiResponse });
                
                // Enable speak button
                speakButton.disabled = false;
                
                // Automatically speak response
                speakText(aiResponse);
                
                statusElement.innerText = "";
                
            } catch (error) {
                console.error('Error processing audio:', error);
                statusElement.innerText = "Error: " + error.message;
            }
        }
        
        // Transcribe audio using Groq API
        async function transcribeAudio(audioBlob, apiKey) {
            const formData = new FormData();
            formData.append('file', audioBlob, 'recording.wav');
            formData.append('model', 'whisper-large-v3-turbo');
            formData.append('prompt', 'Specify context or spelling');
            formData.append('response_format', 'text');
            formData.append('language', 'en');
            formData.append('temperature', 0.0);
            
            const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`
                },
                body: formData
            });
            
            if (!response.ok) {
                const error = await response.text();
                throw new Error(`Transcription failed: ${error}`);
            }
            
            // Handle different response formats
            const contentType = response.headers.get('content-type');
            if (contentType && contentType.includes('application/json')) {
                const data = await response.json();
                return data.text || data;
            } else {
                // If response is plain text
                return await response.text();
            }
        }
        
        // Generate response using Groq API
        async function generateResponse(userInput, apiKey) {
            // Format memory for context
            const memoryText = memory.map(item => 
                `user: ${item.userInput} ai: ${item.aiResponse}`
            ).join('\n');
            
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        {
                            role: "user",
                            content: "you are a helpful ai assistant. you keep everything short." + 
                            "user said:" + userInput + "\n" + memoryText
                        }
                    ]
                })
            });
            
            if (!response.ok) {
                const error = await response.text();
                throw new Error(`Failed to generate response: ${error}`);
            }
            
            const data = await response.json();
            return data.choices[0].message.content;
        }
        
        // Add robotic effects to text
        function robotizeText(text) {
            if (!chopEffect.checked && !pauseEffect.checked) {
                return text;
            }
            
            let roboticText = text;
            
            if (pauseEffect.checked) {
                // Add random pauses with SSML-like syntax
                roboticText = roboticText.replace(/([.!?])\s+/g, '$1 <break time="500ms"> ');
                roboticText = roboticText.replace(/([,;:])\s+/g, '$1 <break time="300ms"> ');
                
                // Add occasional pauses between words (10% chance)
                const words = roboticText.split(' ');
                roboticText = words.map(word => {
                    if (Math.random() < 0.1) {
                        return word + ' <break time="200ms">';
                    }
                    return word;
                }).join(' ');
            }
            
            if (chopEffect.checked) {
                // Create choppy effect by adding space between some words
                const words = roboticText.split(' ');
                roboticText = words.map(word => {
                    // 20% chance of chopping a word
                    if (word.length > 4 && Math.random() < 0.2) {
                        const chopPoint = Math.floor(word.length / 2);
                        return word.substring(0, chopPoint) + ' ' + word.substring(chopPoint);
                    }
                    return word;
                }).join(' ');
            }
            
            return roboticText;
        }
        
        // Process text through chunking for robotic effect
        function chunkText(text) {
            // Replace SSML-like pauses with actual pauses in speech
            const chunks = [];
            let currentChunk = '';
            
            // Parse our custom break tags
            const parts = text.split(/<break time="(\d+)ms">/);
            
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 0) {
                    // Text part
                    currentChunk += parts[i];
                } else {
                    // This is a pause duration
                    chunks.push({
                        text: currentChunk,
                        type: 'text'
                    });
                    currentChunk = '';
                    
                    // Add pause
                    chunks.push({
                        duration: parseInt(parts[i]),
                        type: 'pause'
                    });
                }
            }
            
            // Add any remaining text
            if (currentChunk) {
                chunks.push({
                    text: currentChunk,
                    type: 'text'
                });
            }
            
            return chunks;
        }
        
        // Speak text using browser's speech synthesis with robotic voice effect
        function speakText(text) {
            if (synth.speaking) {
                synth.cancel();
            }
            
            // Apply robotic text effects
            const robotizedText = robotizeText(text);
            
            // Process text into chunks for robotic delivery
            const chunks = chunkText(robotizedText);
            
            statusElement.innerText = "Speaking...";
            
            // Process chunks sequentially
            let chunkIndex = 0;
            
            function processNextChunk() {
                if (chunkIndex >= chunks.length) {
                    statusElement.innerText = "";
                    return;
                }
                
                const chunk = chunks[chunkIndex++];
                
                if (chunk.type === 'pause') {
                    // This is a pause
                    setTimeout(processNextChunk, chunk.duration);
                } else {
                    // This is text to speak
                    const utterance = new SpeechSynthesisUtterance(chunk.text);
                    
                    // Use Google US English voice if found
                    if (googleVoice) {
                        utterance.voice = googleVoice;
                    }
                    
                    // Apply robotic voice settings
                    utterance.rate = parseFloat(rateSlider.value);
                    utterance.pitch = parseFloat(pitchSlider.value);
                    
                    utterance.onend = processNextChunk;
                    synth.speak(utterance);
                }
            }
            
            processNextChunk();
        }
        
        // Add message to conversation UI
        function addToConversation(type, text) {
            const element = document.createElement('div');
            element.className = type;
            
            if (type === 'transcript') {
                element.innerHTML = `<strong>You:</strong> ${text}`;
            } else {
                element.innerHTML = `<strong>Stanley:</strong> ${text}`;
            }
            
            conversationElement.appendChild(element);
            conversationElement.scrollTop = conversationElement.scrollHeight;
        }
    </script>
</body>
</html>
