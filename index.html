<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Car Simulation with Chat</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      /* Global Chat Log styling */
      #chat-log {
        position: absolute;
        bottom: 50px;
        left: 10px;
        width: 300px;
        max-height: 200px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        font-family: monospace;
        font-size: 14px;
        padding: 5px;
        border-radius: 5px;
        z-index: 10;
      }
      /* Chat Input styling */
      #chat-input {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: 300px;
        padding: 5px;
        font-size: 14px;
        display: none;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        z-index: 10;
        background: white;
        color: black;
      }
      /* Floating Chat Message styling */
      .floating-chat {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 2px 5px;
        border-radius: 5px;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
    <!-- Import map for Three.js and Cannon.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/",
          "cannon": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
    
  </head>
  <body>
    <!-- Global Chat Log and Input -->
    <div id="chat-log"></div>
    <input id="chat-input" type="text" placeholder="Type your message..." />
    
    <script type="module">
      import * as THREE from 'three';
      import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
      import * as CANNON from 'cannon';
      
      // Supabase configuration
      const SUPABASE_URL = 'https://skhdesewdziqujemittx.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraGRlc2V3ZHppcXVqZW1pdHR4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0NDc0MTczNCwiZXhwIjoyMDYwMzE3NzM0fQ.kZBOW2U2i7Gkz6dv7_uZ-hBYPxGPY-8s8nt7XhiWSpU';
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
      
      // Unique player ID saved in localStorage
      let playerId = localStorage.getItem('playerId') || '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('playerId', playerId);
      console.log("Player ID:", playerId);
      
      // Chat elements
      const chatLog = document.getElementById('chat-log');
      const chatInput = document.getElementById('chat-input');
      let chatMode = false;
      
      // Chat keyboard handling
      window.addEventListener('keydown', (e) => {
        if (e.key === "Enter" && !chatMode) {
          chatMode = true;
          chatInput.style.display = "block";
          chatInput.focus();
          return;
        }
        if (e.key === "Enter" && chatMode && document.activeElement === chatInput) {
          e.preventDefault();
          const message = chatInput.value.trim();
          if (message !== "") {
            sendMessage(message);
          }
          chatInput.value = "";
          chatInput.blur();
          chatInput.style.display = "none";
          chatMode = false;
        }
        if (chatMode && e.key !== "Enter") {
          e.stopPropagation();
        }
      });
      
      // Send a chat message to Supabase
      async function sendMessage(text) {
        try {
          await supabaseClient.from('messages').insert([{ player_id: playerId, text }]);
        } catch (err) {
          console.error("Failed to send message:", err);
        }
      }
      
      // Global chat polling (fetch messages every 2 seconds)
      async function fetchMessages() {
        try {
          const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);
          if (error) {
            console.error("Error fetching messages:", error);
            return;
          }
          if (!Array.isArray(data)) return;
          // Update global chat log (oldest at top)
          chatLog.innerHTML = data.reverse().map(m => `<div><strong>${m.player_id}</strong>: ${m.text}</div>`).join('');
          
          // For messages within the last 5 seconds, show floating labels
          data.forEach(message => {
            const msgTime = new Date(message.created_at).getTime();
            if (Date.now() - msgTime < 5000) {
              showFloatingMessage(message.player_id, message.text);
            }
          });
        } catch (err) {
          console.error("Error in fetchMessages:", err);
        }
      }
      setInterval(fetchMessages, 2000);
      
      // Three.js Scene Setup
      document.addEventListener("DOMContentLoaded", () => {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // CSS2DRenderer for floating chat messages
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // Cannon.js world setup
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0); // Gravity force
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver = new CANNON.GSSolver();
        world.defaultContactMaterial.contactEquationStiffness = 1e7;
        world.defaultContactMaterial.contactEquationRelaxation = 3;
        
        const cubeMaterial = new CANNON.Material("cubeMaterial");
        
        // Create a plane (ground)
        const groundBody = new CANNON.Body({
          mass: 0, // mass = 0 means static
          position: new CANNON.Vec3(0, 0, 0),
        });
        const groundShape = new CANNON.Plane();
        groundBody.addShape(groundShape);
        world.addBody(groundBody);
        
        // Local player's car (using cannon.js for physics)
        const car = new THREE.Mesh(
          new THREE.BoxGeometry(2, 1, 4),
          new THREE.MeshStandardMaterial({ color: 0xff0000 })
        );
        car.position.y = 0.5;
        scene.add(car);
        
        const carBody = new CANNON.Body({
          mass: 1, // non-zero mass means it's dynamic
          position: new CANNON.Vec3(0, 0.5, 0),
          shape: new CANNON.Box(new CANNON.Vec3(1, 0.5, 2)),
        });
        world.addBody(carBody);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        
        camera.position.set(0, 10, 15);
        camera.lookAt(0, 0, 0);

        // Update function for physics and rendering
        function animate() {
          requestAnimationFrame(animate);
          
          // Update physics world
          world.step(1/60);
          
          // Sync Three.js car with Cannon.js body
          car.position.copy(carBody.position);
          car.rotation.copy(carBody.rotation);
          
          // Render the scene
          renderer.render(scene, camera);
          labelRenderer.render(scene, camera);
        }
        
        animate();
      });
    </script>
  </body>
</html>
