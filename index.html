<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Car Simulation with Chat</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      /* Global Chat Log styling */
      #chat-log {
        position: absolute;
        bottom: 50px;
        left: 10px;
        width: 300px;
        max-height: 200px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        font-family: monospace;
        font-size: 14px;
        padding: 5px;
        border-radius: 5px;
        z-index: 10;
      }
      /* Chat Input styling */
      #chat-input {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: 300px;
        padding: 5px;
        font-size: 14px;
        display: none;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        z-index: 10;
        background: white;
        color: black;
      }
      /* Floating Chat Message styling */
      .floating-chat {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 2px 5px;
        border-radius: 5px;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
    <!-- Import map for Three.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/",
          "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>

  </head>
  <body>
    <!-- Global Chat Log and Input -->
    <div id="chat-log"></div>
    <input id="chat-input" type="text" placeholder="Type your message..." />
    
    <script type="module">
      import * as THREE from 'three';
      import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
      import * as CANNON from 'cannon-es';
    
      // --- Supabase Configuration ---
      const SUPABASE_URL = 'https://skhdesewdziqujemittx.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraGRlc2V3ZHppcXVqZW1pdHR4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0NDc0MTczNCwiZXhwIjoyMDYwMzE3NzM0fQ.kZBOW2U2i7Gkz6dv7_uZ-hBYPxGPY-8s8nt7XhiWSpU';
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
    
      // --- Unique Player ID ---
      let playerId = localStorage.getItem('playerId') || '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('playerId', playerId);
      console.log("Player ID:", playerId);
    
      // --- Initialize Cannon.js World ---
      const world = new CANNON.World();
      world.gravity.set(0, -9.82, 0); // Earth gravity
      world.broadphase = new CANNON.NaiveBroadphase();
      world.solver.iterations = 10;
      world.defaultContactMaterial.friction = 0.3;
      
      // Physics contact materials for different surfaces
      const groundMaterial = new CANNON.Material('ground');
      const wheelMaterial = new CANNON.Material('wheel');
      const carBodyMaterial = new CANNON.Material('carBody');
      const rampMaterial = new CANNON.Material('ramp');
      
      // Define contact behaviors between materials
      const wheelGroundContactMaterial = new CANNON.ContactMaterial(
        wheelMaterial,
        groundMaterial,
        {
          friction: 0.5,
          restitution: 0.3,
          contactEquationStiffness: 1000
        }
      );
      
      const carRampContactMaterial = new CANNON.ContactMaterial(
        carBodyMaterial,
        rampMaterial,
        {
          friction: 0.5,
          restitution: 0.2,
          contactEquationStiffness: 1000
        }
      );
      
      const carCarContactMaterial = new CANNON.ContactMaterial(
        carBodyMaterial,
        carBodyMaterial,
        {
          friction: 0.4,
          restitution: 0.1,
          contactEquationStiffness: 1000
        }
      );
      
      world.addContactMaterial(wheelGroundContactMaterial);
      world.addContactMaterial(carRampContactMaterial);
      world.addContactMaterial(carCarContactMaterial);
      
      // --- Chat Elements ---
      const chatLog = document.getElementById('chat-log');
      const chatInput = document.getElementById('chat-input');
      let chatMode = false;
    
      window.addEventListener('keydown', (e) => {
        if (e.key === "Enter" && !chatMode) {
          chatMode = true;
          chatInput.style.display = "block";
          chatInput.focus();
          return;
        }
        if (e.key === "Enter" && chatMode && document.activeElement === chatInput) {
          e.preventDefault();
          const message = chatInput.value.trim();
          if (message !== "") {
            sendMessage(message);
          }
          chatInput.value = "";
          chatInput.blur();
          chatInput.style.display = "none";
          chatMode = false;
        }
        if (chatMode && e.key !== "Enter") {
          e.stopPropagation();
        }
      });
    
      // --- Send Chat Message ---
      async function sendMessage(text) {
        try {
          await supabaseClient.from('messages').insert([{ player_id: playerId, text }]);
        } catch (err) {
          console.error("Failed to send message:", err);
        }
      }
    
      // --- Global Chat Polling ---
      async function fetchMessages() {
        try {
          const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);
          if (error) {
            console.error("Error fetching messages:", error);
            return;
          }
          if (!Array.isArray(data)) return;
          chatLog.innerHTML = data.reverse().map(m => `<div><strong>${m.player_id}</strong>: ${m.text}</div>`).join('');
    
          // Show floating labels for recent messages
          data.forEach(message => {
            const msgTime = new Date(message.created_at).getTime();
            if (Date.now() - msgTime < 5000) {
              showFloatingMessage(message.player_id, message.text);
            }
          });
        } catch (err) {
          console.error("Error in fetchMessages:", err);
        }
      }
      setInterval(fetchMessages, 2000);
    
      // --- Three.js Scene Setup ---
      document.addEventListener("DOMContentLoaded", () => {
        // Initialize scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
    
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    
        // CSS2DRenderer for floating chat messages
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
    
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    
        // Grid and Terrain
        const grid = new THREE.GridHelper(100, 100);
        scene.add(grid);
        
        // WebGL Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
    
        // Load and configure the texture for the ground plane
        const texture = new THREE.TextureLoader().load('/grass.png');
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.repeat.set(12, 12);
    
        const planeMaterial = new THREE.MeshStandardMaterial({ map: texture });
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);
        
        // --- Create Ground Physics ---
        const groundBody = new CANNON.Body({
          mass: 0, // static
          material: groundMaterial,
          shape: new CANNON.Plane(),
        });
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(groundBody);
        
        // --- Local Player's Car (Red Cube) ---
        const cubeGeometry = new THREE.BoxGeometry(2, 1, 4);
        const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.y = 1.5; // Start a bit higher to avoid clipping with ground
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);

        // Create physics body for the car
        const carBody = new CANNON.Body({
          mass: 150,
          material: carBodyMaterial,
          shape: new CANNON.Box(new CANNON.Vec3(1, 0.5, 2)), // Half extents to match THREE.js
          position: new CANNON.Vec3(cube.position.x, cube.position.y, cube.position.z),
          angularDamping: 0.5, // Prevent excessive rotation
          linearDamping: 0.3,  // Some air resistance
        });
        world.addBody(carBody);
        
        // --- Create a Dynamic Physics Box (demo object) ---
        const boxShape = new CANNON.Box(new CANNON.Vec3(1, 1, 1)); // Half extents
        const boxBody = new CANNON.Body({
          mass: 5,
          material: carBodyMaterial,
          position: new CANNON.Vec3(5, 10, 0),
          shape: boxShape,
        });
        world.addBody(boxBody);
        
        // Physics mesh for the box
        const physMesh = new THREE.Mesh(
          new THREE.BoxGeometry(2, 2, 2),
          new THREE.MeshStandardMaterial({ color: 0x00ff00 })
        );
        physMesh.castShadow = true;
        physMesh.receiveShadow = true;
        scene.add(physMesh);
        
        // --- Additional Scene Object: Ramp ---
        const rampGeometry = new THREE.BoxGeometry(10, 1, 20);
        const rampMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const ramp = new THREE.Mesh(rampGeometry, rampMaterial);
        ramp.position.set(10, 0.5, -20);
        ramp.rotation.x = -Math.PI / 8;
        ramp.castShadow = true;
        ramp.receiveShadow = true;
        scene.add(ramp);

        // Create physics body for the ramp
        const rampShape = new CANNON.Box(new CANNON.Vec3(5, 0.5, 10)); // Half-extents
        const rampBody = new CANNON.Body({
          mass: 0, // Static
          material: rampMaterial,
          shape: rampShape
        });
        
        rampBody.position.set(ramp.position.x, ramp.position.y, ramp.position.z);
        // Match the rotation of the ramp mesh
        const rampQuat = new CANNON.Quaternion();
        rampQuat.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 8);
        rampBody.quaternion.copy(rampQuat);
        world.addBody(rampBody);
        
        // Update physics function
        function updatePhysics(deltaTime) {
          world.step(1/60, deltaTime);
          
          // Update demo physics box
          physMesh.position.copy(boxBody.position);
          physMesh.quaternion.copy(boxBody.quaternion);
          
          // Update player car physics
          cube.position.copy(carBody.position);
          cube.quaternion.copy(carBody.quaternion);
        }
    
        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
    
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048; 
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 500;
        scene.add(directionalLight);
    
        // --- Movement Variables for the Local Player ---
        let keys = {}, velocity = 0, turnVelocity = 0;
        const acceleration = 20, maxSpeed = 30, friction = 0.98;
        const turnAcceleration = 0.5, turnFriction = 0.9, maxTurnSpeed = 4;
    
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);
    
        // --- Remote Players Data ---
        const otherPlayers = {};
        const otherPlayerBodies = {};
    
        // --- Register Local Player in Supabase ---
        async function registerPlayer() {
          try {
            await supabaseClient.from('editors').upsert([{
              player_id: playerId,
              x: cube.position.x,
              y: cube.position.y,
              z: cube.position.z,
              rotation: cube.rotation.y,
            }], { onConflict: ['player_id'] });
          } catch (err) {
            console.error("Error registering player:", err);
          }
        }
    
        // --- Update Local Player State ---
        async function updatePlayerState() {
          try {
            await supabaseClient.from('editors').update({
              x: cube.position.x,
              y: cube.position.y,
              z: cube.position.z,
              rotation: cube.quaternion.y,
            }).match({ player_id: playerId });
          } catch (err) {
            console.error("Error updating player state:", err);
          }
        }
    
        // --- Poll Remote Players ---
        async function getPlayersRealtime() {
          try {
            const { data } = await supabaseClient.from('editors').select('*').neq('player_id', playerId);
            if (!Array.isArray(data)) return;
            
            // Track current player IDs to handle removals
            const currentPlayers = new Set();
            
            data.forEach(p => {
              currentPlayers.add(p.player_id);
              let car = otherPlayers[p.player_id];
              
              if (!car) {
                // Create new car mesh
                car = new THREE.Mesh(cubeGeometry, new THREE.MeshStandardMaterial({ color: 0x0000ff }));
                car.position.set(p.x, p.y, p.z);
                car.castShadow = true;
                car.receiveShadow = true;
                car.userData.target = { x: p.x, y: p.y, z: p.z, rotation: p.rotation };
                car.userData.chatLabel = null;
                scene.add(car);
                otherPlayers[p.player_id] = car;
                
                // Create physics body for other players
                const otherCarBody = new CANNON.Body({
                  mass: 150,
                  material: carBodyMaterial, 
                  shape: new CANNON.Box(new CANNON.Vec3(1, 0.5, 2)),
                  position: new CANNON.Vec3(p.x, p.y, p.z),
                  linearDamping: 0.3,
                  type: CANNON.Body.KINEMATIC, // Kinematic to avoid physics engine controlling movement
                });
                world.addBody(otherCarBody);
                otherPlayerBodies[p.player_id] = otherCarBody;
              } else {
                car.userData.target = { x: p.x, y: p.y, z: p.z, rotation: p.rotation };
                
                // Update physics body position target
                if (otherPlayerBodies[p.player_id]) {
                  otherPlayerBodies[p.player_id].position.set(p.x, p.y, p.z);
                  // Apply some interpolation or rotation if needed
                }
              }
            });
            
            // Remove players that are no longer in the data
            Object.keys(otherPlayers).forEach(id => {
              if (!currentPlayers.has(id)) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
                
                if (otherPlayerBodies[id]) {
                  world.removeBody(otherPlayerBodies[id]);
                  delete otherPlayerBodies[id];
                }
              }
            });
            
          } catch (err) {
            console.error("Error in getPlayersRealtime:", err);
          }
        }
        setInterval(getPlayersRealtime, 50);
    
        // --- Floating Chat Message ---
        function showFloatingMessage(targetPlayerId, message) {
          let car = (targetPlayerId === playerId) ? cube : otherPlayers[targetPlayerId];
          if (!car) return;
          if (car.userData.chatLabel) {
            car.userData.chatLabel.element.innerHTML = message;
            clearTimeout(car.userData.chatLabel.timer);
          } else {
            const div = document.createElement('div');
            div.className = 'floating-chat';
            div.innerHTML = message;
            const labelObject = new CSS2DObject(div);
            labelObject.position.set(0, 2, 0);
            car.add(labelObject);
            car.userData.chatLabel = labelObject;
          }
          car.userData.chatLabel.timer = setTimeout(() => {
            if (car.userData.chatLabel) {
              car.remove(car.userData.chatLabel);
              car.userData.chatLabel = null;
            }
          }, 5000);
        }
        
        // --- Remove Local Player Record on Unload ---
        window.addEventListener('beforeunload', () => {
          supabaseClient.from('editors').delete().match({ player_id: playerId });
        });
    
        // --- Idle Timeout Check ---
        let lastMovementTime = Date.now();
        async function checkIdleTimeout() {
          const now = Date.now();
          const idleTime = now - lastMovementTime;
    
          if (idleTime > 2 * 60 * 1000) { // 2 minutes
            await supabaseClient.from('messages').insert([{
              player_id: playerId,
              text: "was kicked due to inactivity."
            }]);
    
            await supabaseClient.from('editors').delete().match({ player_id: playerId });
            alert("You were kicked due to inactivity.");
            location.reload();
          }
        }
        setInterval(checkIdleTimeout, 10000);
        
        // --- Collision detection event listener ---
        carBody.addEventListener("collide", (event) => {
          const relativeVelocity = event.contact.getImpactVelocityAlongNormal();
          
          // Only report significant collisions
          if (Math.abs(relativeVelocity) > 5) {
            console.log(`Collision detected with velocity: ${relativeVelocity}`);
            
            // Optionally send a message to chat for significant collisions
            if (Math.abs(relativeVelocity) > 10) {
              sendMessage("Crashed with a loud BANG!");
            }
          }
        });
    
        // --- Unified Animation Loop ---
        let prevTime;
        let lastUpdate = Date.now();
    
        function animate(time) {
          requestAnimationFrame(animate);
          
          const deltaTime = prevTime ? (time - prevTime) / 1000 : 0;
          prevTime = time;
    
          // --- Local Player Movement ---
          let forceX = 0, forceZ = 0;
          
          if (keys["ArrowUp"]) {
            // Apply force in the direction the car is facing
            forceZ = -acceleration * Math.cos(carBody.quaternion.y);
            forceX = -acceleration * Math.sin(carBody.quaternion.y);
            carBody.applyLocalForce(new CANNON.Vec3(0, 0, -acceleration), new CANNON.Vec3(0, 0, 0));
          }
          
          if (keys["ArrowDown"]) {
            // Apply braking or reverse force
            forceZ = acceleration * Math.cos(carBody.quaternion.y);
            forceX = acceleration * Math.sin(carBody.quaternion.y);            
            carBody.applyLocalForce(new CANNON.Vec3(0, 0, acceleration), new CANNON.Vec3(0, 0, 0));
          }
          
          // Apply turning forces
          if (keys["ArrowRight"]) {
            carBody.applyTorque(new CANNON.Vec3(0, turnAcceleration, 0));
          } else if (keys["ArrowLeft"]) {
            carBody.applyTorque(new CANNON.Vec3(0, -turnAcceleration, 0));
          }
          
          // Apply some damping to rotation
          carBody.angularVelocity.scale(0.95);
          
          // Limit speed
          const speed = carBody.velocity.length();
          if (speed > maxSpeed) {
            carBody.velocity.scale(maxSpeed / speed);
          }
          
          if (Math.abs(forceX) > 0.001 || Math.abs(forceZ) > 0.001) {
            lastMovementTime = Date.now();
          }
          
          // --- Physics Update ---
          updatePhysics(deltaTime);
    
          // --- Camera Follow ---
          camera.position.set(
            cube.position.x + Math.sin(cube.rotation.y) * 10,
            cube.position.y + 5,
            cube.position.z + Math.cos(cube.rotation.y) * 10
          );
          camera.lookAt(cube.position);
    
          // --- Remote Players Interpolation ---
          Object.values(otherPlayers).forEach(car => {
            const target = car.userData.target;
            if (!target) return;
            car.position.lerp(new THREE.Vector3(target.x, target.y, target.z), 0.1);
            car.rotation.y += (target.rotation - car.rotation.y) * 0.1;
          });
    
          // --- Update Local Player State Every 50ms ---
          if (Date.now() - lastUpdate > 50) {
            updatePlayerState();
            lastUpdate = Date.now();
          }
    
          // --- Render Scene and CSS Labels ---
          renderer.render(scene, camera);
          labelRenderer.render(scene, camera);
        }
        
        registerPlayer();
        requestAnimationFrame(animate);
      });
    </script>
    
  </body>
</html>
