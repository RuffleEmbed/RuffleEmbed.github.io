<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Car Simulation with Chat and Physics</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      /* Global Chat Log styling */
      #chat-log {
        position: absolute;
        bottom: 50px;
        left: 10px;
        width: 300px;
        max-height: 200px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        font-family: monospace;
        font-size: 14px;
        padding: 5px;
        border-radius: 5px;
        z-index: 10;
      }
      /* Chat Input styling */
      #chat-input {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: 300px;
        padding: 5px;
        font-size: 14px;
        display: none;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        z-index: 10;
        background: white;
        color: black;
      }
      /* Floating Chat Message styling */
      .floating-chat {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 2px 5px;
        border-radius: 5px;
        font-size: 12px;
        white-space: nowrap;
      }
    </style>
    <!-- Import map for Three.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
        }
      }
    </script>
    <!-- Import Cannon.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  </head>
  <body>
    <!-- Global Chat Log and Input -->
    <div id="chat-log"></div>
    <input id="chat-input" type="text" placeholder="Type your message..." />
    
    <script type="module">
      import * as THREE from 'three';
      import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
      
      // Supabase configuration
      const SUPABASE_URL = 'https://skhdesewdziqujemittx.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraGRlc2V3ZHppcXVqZW1pdHR4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0NDc0MTczNCwiZXhwIjoyMDYwMzE3NzM0fQ.kZBOW2U2i7Gkz6dv7_uZ-hBYPxGPY-8s8nt7XhiWSpU';
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
      
      // Unique player ID saved in localStorage
      let playerId = localStorage.getItem('playerId') || '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('playerId', playerId);
      console.log("Player ID:", playerId);
      
      // Chat elements
      const chatLog = document.getElementById('chat-log');
      const chatInput = document.getElementById('chat-input');
      let chatMode = false;
      
      // Chat keyboard handling
      window.addEventListener('keydown', (e) => {
        if (e.key === "Enter" && !chatMode) {
          chatMode = true;
          chatInput.style.display = "block";
          chatInput.focus();
          return;
        }
        if (e.key === "Enter" && chatMode && document.activeElement === chatInput) {
          e.preventDefault();
          const message = chatInput.value.trim();
          if (message !== "") {
            sendMessage(message);
          }
          chatInput.value = "";
          chatInput.blur();
          chatInput.style.display = "none";
          chatMode = false;
        }
        if (chatMode && e.key !== "Enter") {
          e.stopPropagation();
        }
      });
      
      // Send a chat message to Supabase
      async function sendMessage(text) {
        try {
          await supabaseClient.from('messages').insert([{ player_id: playerId, text }]);
        } catch (err) {
          console.error("Failed to send message:", err);
        }
      }
      
      // Global chat polling (fetch messages every 2 seconds)
      async function fetchMessages() {
        try {
          const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);
          if (error) {
            console.error("Error fetching messages:", error);
            return;
          }
          if (!Array.isArray(data)) return;
          // Update global chat log (oldest at top)
          chatLog.innerHTML = data.reverse().map(m => `<div><strong>${m.player_id}</strong>: ${m.text}</div>`).join('');
          
          // For messages within the last 5 seconds, show floating labels
          data.forEach(message => {
            const msgTime = new Date(message.created_at).getTime();
            if (Date.now() - msgTime < 5000) {
              showFloatingMessage(message.player_id, message.text);
            }
          });
        } catch (err) {
          console.error("Error in fetchMessages:", err);
        }
      }
      setInterval(fetchMessages, 2000);
      
      // Three.js and Cannon.js Scene Setup
      document.addEventListener("DOMContentLoaded", () => {
        // Three.js scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // CSS2DRenderer for floating chat messages
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Setup Cannon.js physics world
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0); // Earth gravity
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 10;
        world.defaultContactMaterial.friction = 0.3;
        
        // Create ground physics body
        const groundShape = new CANNON.Plane();
        const groundBody = new CANNON.Body({ mass: 0 }); // mass 0 = static
        groundBody.addShape(groundShape);
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2); // rotate to be flat
        world.addBody(groundBody);
        
        // Create ramp physics body
        const rampShape = new CANNON.Box(new CANNON.Vec3(5, 0.5, 10)); // half-dimensions
        const rampBody = new CANNON.Body({ mass: 0 });
        rampBody.addShape(rampShape);
        rampBody.position.set(10, 0.5, -20);
        rampBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 8);
        world.addBody(rampBody);
        
        // Visual scene setup
        const grid = new THREE.GridHelper(100, 100);
        scene.add(grid);

        // Load and configure the texture
        const texture = new THREE.TextureLoader().load('/grass.png');
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.repeat.set(12, 12);

        // Create material with the texture
        const planeMaterial = new THREE.MeshStandardMaterial({ map: texture });

        // Create and rotate the plane
        const plane = new THREE.Mesh(
          new THREE.PlaneGeometry(100, 100),
          planeMaterial
        );
        plane.rotation.x = -Math.PI / 2;
        scene.add(plane);
        
        // Local player's car (red cube)
        const cubeGeometry = new THREE.BoxGeometry(2, 1, 4);
        const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.y = 1; // Start slightly above ground
        scene.add(cube);
        
        // Car physics body
        const carShape = new CANNON.Box(new CANNON.Vec3(1, 0.5, 2)); // half-dimensions
        const carBody = new CANNON.Body({ 
          mass: 500, // car mass in kg
          angularDamping: 0.3, // reduce spin
          linearDamping: 0.3  // add some air resistance
        });
        carBody.addShape(carShape);
        carBody.position.set(cube.position.x, cube.position.y, cube.position.z);
        carBody.quaternion.set(0, 0, 0, 1);
        world.addBody(carBody);
        
        // Ramp visual object
        const rampGeometry = new THREE.BoxGeometry(10, 1, 20); // width, height, depth
        const rampMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 }); // Brown ramp
        const ramp = new THREE.Mesh(rampGeometry, rampMaterial);
        
        // Position and rotate ramp (matches physics body)
        ramp.position.set(10, 0.5, -20);
        ramp.rotation.x = -Math.PI / 8;
        scene.add(ramp);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);
        
        camera.position.set(0, 10, 15);
        camera.lookAt(0, 0, 0);
        
        // Movement variables for local player
        const keys = {};
        const maxForce = 5000;
        const maxSteerVal = 0.5;
        let steeringVal = 0;
        
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);
        
        // Store remote players and their data
        const otherPlayers = {};
        const otherPlayerBodies = {};
        
        // Register local player in Supabase
        async function registerPlayer() {
          try {
            await supabaseClient.from('editors').upsert([{
              player_id: playerId,
              x: cube.position.x,
              y: cube.position.y,
              z: cube.position.z,
              rotation: cube.rotation.y,
            }], { onConflict: ['player_id'] });
          } catch (err) {
            console.error("Error registering player:", err);
          }
        }
        
        async function checkIdleTimeout() {
          const now = Date.now();
          const idleTime = now - lastMovementTime;

          if (idleTime > 2 * 60 * 1000) { // 2 minutes
            await supabaseClient.from('messages').insert([{
              player_id: playerId,
              text: "was kicked due to inactivity."
            }]);

            await supabaseClient.from('editors').delete().match({ player_id: playerId });

            alert("You were kicked due to inactivity.");
            location.reload();
          }
        }
        
        setInterval(checkIdleTimeout, 10000); // Check every 10 seconds
        
        // Update local player state in Supabase
        async function updatePlayerState() {
          try {
            await supabaseClient.from('editors').update({
              x: cube.position.x,
              y: cube.position.y,
              z: cube.position.z,
              rotation: cube.rotation.y,
            }).match({ player_id: playerId });
          } catch (err) {
            console.error("Error updating player state:", err);
          }
        }
        
        // Poll remote players for state (excluding local player)
        async function getPlayersRealtime() {
          try {
            const { data } = await supabaseClient.from('editors').select('*').neq('player_id', playerId);
            if (!Array.isArray(data)) return;
            data.forEach(p => {
              let car = otherPlayers[p.player_id];
              if (!car) {
                // Create visual car for remote player
                car = new THREE.Mesh(cubeGeometry, new THREE.MeshStandardMaterial({ color: 0x0000ff }));
                car.position.set(p.x, p.y, p.z);
                car.rotation.y = p.rotation;
                scene.add(car);
                otherPlayers[p.player_id] = car;
                
                // Create physics body for remote player
                const otherCarBody = new CANNON.Body({ mass: 500 });
                otherCarBody.addShape(carShape);
                otherCarBody.position.set(p.x, p.y, p.z);
                otherCarBody.quaternion.set(0, Math.sin(p.rotation/2), 0, Math.cos(p.rotation/2));
                world.addBody(otherCarBody);
                otherPlayerBodies[p.player_id] = otherCarBody;
                
                // No floating label yet
                car.userData.chatLabel = null;
              } else {
                // Update target position
                const otherCarBody = otherPlayerBodies[p.player_id];
                if (otherCarBody) {
                  // Apply gentle force toward target position for smoother network physics
                  const targetPos = new CANNON.Vec3(p.x, p.y, p.z);
                  const currentPos = otherCarBody.position;
                  const force = new CANNON.Vec3().copy(targetPos).vsub(currentPos);
                  force.scale(5, force); // Adjust strength as needed
                  otherCarBody.applyForce(force, currentPos);
                  
                  // Gradually rotate toward target rotation
                  const targetQuat = new CANNON.Quaternion();
                  targetQuat.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), p.rotation);
                  otherCarBody.quaternion.slerp(targetQuat, 0.1, otherCarBody.quaternion);
                }
              }
            });
          } catch (err) {
            console.error("Error in getPlayersRealtime:", err);
          }
        }
        setInterval(getPlayersRealtime, 50);
        
        // Show a floating chat message above a car (local or remote)
        function showFloatingMessage(targetPlayerId, message) {
          // Get the corresponding car: local (cube) or remote
          let car = (targetPlayerId === playerId) ? cube : otherPlayers[targetPlayerId];
          if (!car) return;
          if (car.userData.chatLabel) {
            car.userData.chatLabel.element.innerHTML = message;
            clearTimeout(car.userData.chatLabel.timer);
          } else {
            const div = document.createElement('div');
            div.className = 'floating-chat';
            div.innerHTML = message;
            const labelObject = new CSS2DObject(div);
            labelObject.position.set(0, 2, 0); // Adjust offset as needed
            car.add(labelObject);
            car.userData.chatLabel = labelObject;
          }
          car.userData.chatLabel.timer = setTimeout(() => {
            if (car.userData.chatLabel) {
              car.remove(car.userData.chatLabel);
              car.userData.chatLabel = null;
            }
          }, 5000);
        }
        
        // Remove local player's record on unload
        window.addEventListener('beforeunload', () => {
          supabaseClient.from('editors').delete().match({ player_id: playerId });
        });
        
        // Animation loop for local player movement and rendering
        let lastUpdate = Date.now();
        let lastMovementTime = Date.now();
        
        function animate() {
          requestAnimationFrame(animate);
          
          // Step the physics world
          world.step(1/60);
          
          // Handle car controls
          const forwardVelocity = carBody.velocity.dot(
            new CANNON.Vec3(
              Math.sin(carBody.quaternion.toEuler().y),
              0,
              Math.cos(carBody.quaternion.toEuler().y)
            )
          );
          
          // Steering controls
          if (keys["ArrowLeft"]) {
            steeringVal += 0.01;
            if (steeringVal > maxSteerVal) steeringVal = maxSteerVal;
          } else if (keys["ArrowRight"]) {
            steeringVal -= 0.01;
            if (steeringVal < -maxSteerVal) steeringVal = -maxSteerVal;
          } else {
            // Return to center gradually
            steeringVal *= 0.9;
          }
          
          // Apply steering as torque
          carBody.applyTorque(new CANNON.Vec3(0, steeringVal * maxForce * (forwardVelocity > 0 ? 1 : -1), 0));
          
          // Acceleration/braking controls
          let engineForce = 0;
          
          if (keys["ArrowUp"]) {
            engineForce = maxForce;
            lastMovementTime = Date.now();
          }
          if (keys["ArrowDown"]) {
            engineForce = -maxForce;
            lastMovementTime = Date.now();
          }
          
          // Apply engine force in local forward direction
          const forwardDir = new CANNON.Vec3(
            Math.sin(carBody.quaternion.toEuler().y),
            0,
            Math.cos(carBody.quaternion.toEuler().y)
          );
          forwardDir.normalize();
          forwardDir.scale(engineForce, forwardDir);
          carBody.applyForce(forwardDir, carBody.position);
          
          // Space for jumping (useful for testing physics)
          if (keys[" "]) {
            carBody.applyImpulse(new CANNON.Vec3(0, 2000, 0), carBody.position);
            lastMovementTime = Date.now();
          }
          
          // Update cube position from physics
          cube.position.copy(carBody.position);
          cube.quaternion.copy(carBody.quaternion);
          
          // Update remote players' visual positions from physics
          Object.keys(otherPlayers).forEach(id => {
            const car = otherPlayers[id];
            const body = otherPlayerBodies[id];
            if (car && body) {
              car.position.copy(body.position);
              car.quaternion.copy(body.quaternion);
            }
          });
          
          // Update camera
          const cameraOffset = new THREE.Vector3(
            -10 * Math.sin(cube.rotation.y),
            5,
            -10 * Math.cos(cube.rotation.y)
          );
          camera.position.copy(cube.position).add(cameraOffset);
          camera.lookAt(cube.position);
          
          if (Date.now() - lastUpdate > 50) {
            updatePlayerState();
            lastUpdate = Date.now();
          }
          
          renderer.render(scene, camera);
          labelRenderer.render(scene, camera);
        }
        
        registerPlayer();
        animate();
      });
    </script>
  </body>
</html>
