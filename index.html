<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplayer Car Simulation with Chat</title>
    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
      #chat-log {
        position: absolute;
        bottom: 50px;
        left: 10px;
        width: 300px;
        max-height: 200px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        font-family: monospace;
        font-size: 14px;
        padding: 5px;
        border-radius: 5px;
        z-index: 10;
      }
      #chat-input {
        position: absolute;
        bottom: 10px;
        left: 10px;
        width: 300px;
        padding: 5px;
        font-size: 14px;
        display: none;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
        z-index: 10;
        background: white;
        color: black;
      }
      .floating-chat {
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 2px 5px;
        border-radius: 5px;
        font-size: 12px;
        white-space: nowrap;
      }
      #debug-info {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.5);
        color: white;
        font-family: monospace;
        padding: 5px;
        border-radius: 5px;
        pointer-events: none;
      }
    </style>
    <!-- Import map for Three.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/",
          "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
  </head>
  <body>
    <!-- Global Chat Log and Input -->
    <div id="chat-log"></div>
    <input id="chat-input" type="text" placeholder="Type your message..." />
    <div id="debug-info"></div>
    
    <script type="module">
      import * as THREE from 'three';
      import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
      import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
      
      // --- Supabase Configuration ---
      const SUPABASE_URL = 'https://skhdesewdziqujemittx.supabase.co';
      const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNraGRlc2V3ZHppcXVqZW1pdHR4Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc0NDc0MTczNCwiZXhwIjoyMDYwMzE3NzM0fQ.kZBOW2U2i7Gkz6dv7_uZ-hBYPxGPY-8s8nt7XhiWSpU';
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);
    
      // --- Unique Player ID ---
      let playerId = localStorage.getItem('playerId') || '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('playerId', playerId);
      console.log("Player ID:", playerId);
    
      // --- Chat Elements ---
      const chatLog = document.getElementById('chat-log');
      const chatInput = document.getElementById('chat-input');
      const debugInfo = document.getElementById('debug-info');
      let chatMode = false;
    
      window.addEventListener('keydown', (e) => {
        if (e.key === "Enter" && !chatMode) {
          chatMode = true;
          chatInput.style.display = "block";
          chatInput.focus();
          return;
        }
        if (e.key === "Enter" && chatMode && document.activeElement === chatInput) {
          e.preventDefault();
          const message = chatInput.value.trim();
          if (message !== "") {
            sendMessage(message);
          }
          chatInput.value = "";
          chatInput.blur();
          chatInput.style.display = "none";
          chatMode = false;
        }
        if (chatMode && e.key !== "Enter") {
          e.stopPropagation();
        }
      });
    
      // --- Send Chat Message ---
      async function sendMessage(text) {
        try {
          await supabaseClient.from('messages').insert([{ player_id: playerId, text }]);
        } catch (err) {
          console.error("Failed to send message:", err);
        }
      }
    
      // --- Global Chat Polling ---
      async function fetchMessages() {
        try {
          const { data, error } = await supabaseClient
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(20);
          if (error) {
            console.error("Error fetching messages:", error);
            return;
          }
          if (!Array.isArray(data)) return;
          chatLog.innerHTML = data.reverse().map(m => `<div><strong>${m.player_id}</strong>: ${m.text}</div>`).join('');
    
          // Show floating labels for recent messages
          data.forEach(message => {
            const msgTime = new Date(message.created_at).getTime();
            if (Date.now() - msgTime < 5000) {
              showFloatingMessage(message.player_id, message.text);
            }
          });
        } catch (err) {
          console.error("Error in fetchMessages:", err);
        }
      }
      setInterval(fetchMessages, 2000);
    
      // --- Three.js Scene Setup ---
      document.addEventListener("DOMContentLoaded", () => {
        // Initialize scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
    
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    
        // CSS2DRenderer for floating chat messages
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
    
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // WebGL Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
    
        // --- CANNON.js Physics World ---
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 10;
        world.defaultContactMaterial.friction = 0.3;
        
        // Ground plane physics material
        const groundPhysMaterial = new CANNON.Material("groundMaterial");
        const wheelPhysMaterial = new CANNON.Material("wheelMaterial");
        const groundWheelContactMaterial = new CANNON.ContactMaterial(
          groundPhysMaterial,
          wheelPhysMaterial,
          { 
            friction: 0.5, 
            restitution: 0.3,
            contactEquationStiffness: 1000
          }
        );
        world.addContactMaterial(groundWheelContactMaterial);

        // Ground physics body
        const groundShape = new CANNON.Plane();
        const groundBody = new CANNON.Body({ 
          mass: 0,
          material: groundPhysMaterial
        });
        groundBody.addShape(groundShape);
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI/2);
        world.addBody(groundBody);
        
        // --- Load Ground Texture ---
        const texture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.repeat.set(12, 12);
    
        const planeMaterial = new THREE.MeshStandardMaterial({ map: texture });
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);
        
        // Grid helper
        const grid = new THREE.GridHelper(100, 100);
        scene.add(grid);
        
        // --- Physics Box for Collisions ---
        // Physics body
        const boxSize = { x: 2, y: 2, z: 2 };
        const boxShape = new CANNON.Box(new CANNON.Vec3(boxSize.x/2, boxSize.y/2, boxSize.z/2));
        const boxBody = new CANNON.Body({ 
          mass: 5, 
          position: new CANNON.Vec3(5, 10, 0),
        });
        boxBody.addShape(boxShape);
        world.addBody(boxBody);
        
        // Three.js mesh
        const boxMesh = new THREE.Mesh(
          new THREE.BoxGeometry(boxSize.x, boxSize.y, boxSize.z),
          new THREE.MeshStandardMaterial({ color: 0x00ff00 })
        );
        boxMesh.position.copy(boxBody.position);
        boxMesh.castShadow = true;
        boxMesh.receiveShadow = true;
        scene.add(boxMesh);
        
        // --- Create Ramp ---
        // Ramp physics body
        const rampSize = { x: 10, y: 1, z: 20 };
        const rampShape = new CANNON.Box(new CANNON.Vec3(rampSize.x/2, rampSize.y/2, rampSize.z/2));
        const rampBody = new CANNON.Body({ 
          mass: 0, 
          position: new CANNON.Vec3(10, 0.5, -20)
        });
        rampBody.addShape(rampShape);
        // Tilt the ramp
        const angle = -Math.PI / 8;
        rampBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), angle);
        world.addBody(rampBody);
        
        // Ramp Three.js mesh
        const rampGeometry = new THREE.BoxGeometry(rampSize.x, rampSize.y, rampSize.z);
        const rampMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
        const ramp = new THREE.Mesh(rampGeometry, rampMaterial);
        ramp.position.copy(rampBody.position);
        ramp.quaternion.copy(rampBody.quaternion);
        ramp.castShadow = true;
        ramp.receiveShadow = true;
        scene.add(ramp);
        
        // Add some obstacles
        const createObstacle = (x, z, size = 2) => {
          const obstacleShape = new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2));
          const obstacleBody = new CANNON.Body({
            mass: 0, // Static object
            position: new CANNON.Vec3(x, size/2, z)
          });
          obstacleBody.addShape(obstacleShape);
          world.addBody(obstacleBody);
          
          const obstacleMesh = new THREE.Mesh(
            new THREE.BoxGeometry(size, size, size),
            new THREE.MeshStandardMaterial({ color: 0xff6600 })
          );
          obstacleMesh.position.copy(obstacleBody.position);
          obstacleMesh.castShadow = true;
          obstacleMesh.receiveShadow = true;
          scene.add(obstacleMesh);
          
          return { body: obstacleBody, mesh: obstacleMesh };
        };
        
        // Create some obstacles
        const obstacles = [
          createObstacle(-15, -15, 3),
          createObstacle(-5, 20, 2),
          createObstacle(20, 15, 4)
        ];
        
        // --- Player Car Setup ---
        // Car physics body
        const carSize = { x: 2, y: 1, z: 4 };
        const carShape = new CANNON.Box(new CANNON.Vec3(carSize.x/2, carSize.y/2, carSize.z/2));
        const carBody = new CANNON.Body({ 
          mass: 200,
          material: wheelPhysMaterial,
          angularDamping: 0.5
        });
        carBody.addShape(carShape);
        carBody.position.set(0, 2, 0);
        world.addBody(carBody);
        
        // Car mesh
        const cubeGeometry = new THREE.BoxGeometry(carSize.x, carSize.y, carSize.z);
        const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.castShadow = true;
        cube.receiveShadow = true;
        scene.add(cube);
        
        // Add wheels visually (no physics separate from car body yet)
        const wheelRadius = 0.4;
        const wheelGeometry = new THREE.CylinderGeometry(wheelRadius, wheelRadius, 0.4, 16);
        const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const wheels = [];
        
        // Wheel positions relative to car
        const wheelPositions = [
          { x: -0.9, y: -0.3, z: 1.2 },  // Front left
          { x: 0.9, y: -0.3, z: 1.2 },   // Front right
          { x: -0.9, y: -0.3, z: -1.2 }, // Rear left
          { x: 0.9, y: -0.3, z: -1.2 }   // Rear right
        ];
        
        wheelPositions.forEach(pos => {
          const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
          wheel.position.set(pos.x, pos.y, pos.z);
          wheel.rotation.z = Math.PI / 2; // Rotate to correct orientation
          wheel.castShadow = true;
          cube.add(wheel); // Attach to car
          wheels.push(wheel);
        });
        
        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
    
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048; 
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 500;
        scene.add(directionalLight);
    
        // --- Movement Controls ---
        let keys = {};
        const carSettings = {
          engineForce: 0,        // Current engine force
          maxForce: 1000,        // Maximum engine force
          brakeForce: 0,         // Current brake force
          maxBrakeForce: 50,     // Maximum brake force
          steeringAngle: 0,      // Current steering angle
          maxSteeringAngle: Math.PI/6, // Maximum steering angle
          steeringSpeed: 0.05,   // How quickly steering changes
          frictionForce: 0.03    // Natural friction slowdown
        };
    
        window.addEventListener('keydown', e => {
          keys[e.key] = true;
        });
        window.addEventListener('keyup', e => keys[e.key] = false);
    
        // --- Remote Players Data ---
        const otherPlayers = {};
    
        // --- Register Local Player in Supabase ---
        async function registerPlayer() {
          try {
            await supabaseClient.from('editors').upsert([{
              player_id: playerId,
              x: carBody.position.x,
              y: carBody.position.y,
              z: carBody.position.z,
              rotation: carBody.quaternion,
            }], { onConflict: ['player_id'] });
          } catch (err) {
            console.error("Error registering player:", err);
          }
        }
    
        // --- Update Local Player State ---
        async function updatePlayerState() {
          try {
            await supabaseClient.from('editors').update({
              x: carBody.position.x,
              y: carBody.position.y,
              z: carBody.position.z,
              rotation: cube.rotation.y,
            }).match({ player_id: playerId });
          } catch (err) {
            console.error("Error updating player state:", err);
          }
        }
    
        // --- Poll Remote Players ---
        async function getPlayersRealtime() {
          try {
            const { data } = await supabaseClient.from('editors').select('*').neq('player_id', playerId);
            if (!Array.isArray(data)) return;
            
            // Track current player IDs to handle removals
            const currentPlayers = new Set();
            
            data.forEach(p => {
              currentPlayers.add(p.player_id);
              let car = otherPlayers[p.player_id];
              
              if (!car) {
                // Create new car mesh
                car = new THREE.Mesh(cubeGeometry, new THREE.MeshStandardMaterial({ color: 0x0000ff }));
                car.position.set(p.x, p.y, p.z);
                car.castShadow = true;
                car.receiveShadow = true;
                car.userData.target = { x: p.x, y: p.y, z: p.z, rotation: p.rotation };
                car.userData.chatLabel = null;
                
                // Add wheels to other players' cars too
                wheelPositions.forEach(pos => {
                  const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                  wheel.position.set(pos.x, pos.y, pos.z);
                  wheel.rotation.z = Math.PI / 2;
                  wheel.castShadow = true;
                  car.add(wheel);
                });
                
                scene.add(car);
                otherPlayers[p.player_id] = car;
              } else {
                // Update target for smooth interpolation
                car.userData.target = { x: p.x, y: p.y, z: p.z, rotation: p.rotation };
              }
            });
            
            // Remove players that are no longer in the data
            Object.keys(otherPlayers).forEach(id => {
              if (!currentPlayers.has(id)) {
                scene.remove(otherPlayers[id]);
                delete otherPlayers[id];
              }
            });
            
          } catch (err) {
            console.error("Error in getPlayersRealtime:", err);
          }
        }
        setInterval(getPlayersRealtime, 50);
    
        // --- Floating Chat Message ---
        function showFloatingMessage(targetPlayerId, message) {
          let car = (targetPlayerId === playerId) ? cube : otherPlayers[targetPlayerId];
          if (!car) return;
          if (car.userData.chatLabel) {
            car.userData.chatLabel.element.innerHTML = message;
            clearTimeout(car.userData.chatLabel.timer);
          } else {
            const div = document.createElement('div');
            div.className = 'floating-chat';
            div.innerHTML = message;
            const labelObject = new CSS2DObject(div);
            labelObject.position.set(0, 2, 0);
            car.add(labelObject);
            car.userData.chatLabel = labelObject;
          }
          car.userData.chatLabel.timer = setTimeout(() => {
            if (car.userData.chatLabel) {
              car.remove(car.userData.chatLabel);
              car.userData.chatLabel = null;
            }
          }, 5000);
        }
        
        // --- Remove Local Player Record on Unload ---
        window.addEventListener('beforeunload', () => {
          supabaseClient.from('editors').delete().match({ player_id: playerId });
        });
    
        // --- Idle Timeout Check ---
        let lastMovementTime = Date.now();
        async function checkIdleTimeout() {
          const now = Date.now();
          const idleTime = now - lastMovementTime;
    
          if (idleTime > 2 * 60 * 1000) { // 2 minutes
            await supabaseClient.from('messages').insert([{
              player_id: playerId,
              text: "was kicked due to inactivity."
            }]);
    
            await supabaseClient.from('editors').delete().match({ player_id: playerId });
            alert("You were kicked due to inactivity.");
            location.reload();
          }
        }
        setInterval(checkIdleTimeout, 10000);
        
        // --- Unified Animation Loop ---
        let prevTime;
        let lastUpdate = Date.now();
        const timeStep = 1/60; // Fixed time step for physics
        
        function animate(time) {
          requestAnimationFrame(animate);
          
          const deltaTime = prevTime ? (time - prevTime) / 1000 : 0;
          prevTime = time;
          
          // Update physics world
          world.step(timeStep);
          
          // --- Car Movement with CANNON.js Physics ---
          if (!chatMode) {
            // Reset forces
            carBody.force.set(0, 0, 0);
            carBody.angularVelocity.set(0, 0, 0);
            
            // Get car's forward direction vector using CANNON.js methods
            // Create a forward vector
            const forwardVec = new CANNON.Vec3(0, 0, -1);
            
            // Create a quaternion representing car's rotation
            const carRotation = carBody.quaternion;
            
            // Use vmult to transform the vector (this is CANNON.js way to apply a quaternion)
            const rotatedForwardVec = new CANNON.Vec3();
            carRotation.vmult(forwardVec, rotatedForwardVec);
            
            // Forward/backward movement
            if (keys["ArrowUp"] || keys["w"]) {
              // Apply force in car's forward direction
              const force = rotatedForwardVec.scale(carSettings.maxForce);
              carBody.applyForce(force, carBody.position);
              lastMovementTime = Date.now();
            } else if (keys["ArrowDown"] || keys["s"]) {
              // Apply force in car's backward direction
              const force = rotatedForwardVec.scale(-carSettings.maxForce * 0.5);
              carBody.applyForce(force, carBody.position);
              lastMovementTime = Date.now();
            }
            
            // Apply braking
            if (keys[" "]) {
              // Calculate opposite direction to velocity
              const vel = carBody.velocity.length();
              if (vel > 0.1) {
                const brakeDir = carBody.velocity.clone().scale(-1 / vel);
                const brakeForce = brakeDir.scale(carSettings.maxBrakeForce);
                carBody.applyForce(brakeForce, carBody.position);
                lastMovementTime = Date.now();
              }
            }
            
            // Turning
            if (keys["ArrowLeft"] || keys["a"]) {
              // Apply torque for left turn
              carBody.applyTorque(new CANNON.Vec3(0, carSettings.maxSteeringAngle, 0));
              lastMovementTime = Date.now();
            }
            if (keys["ArrowRight"] || keys["d"]) {
              // Apply torque for right turn
              carBody.applyTorque(new CANNON.Vec3(0, -carSettings.maxSteeringAngle, 0));
              lastMovementTime = Date.now();
            }
            
            // Simple friction to slow down when not accelerating
            if (!keys["ArrowUp"] && !keys["w"] && !keys["ArrowDown"] && !keys["s"]) {
              const vel = carBody.velocity;
              if (vel.length() > 0.1) {
                const frictionForce = vel.normalize();
                frictionForce.scale(-carSettings.frictionForce * carBody.mass);
                carBody.applyForce(frictionForce, carBody.position);
              }
            }
            
            // Jump with spacebar only if near ground
            if (keys["Space"] && carBody.position.y < 2) {
              carBody.applyImpulse(new CANNON.Vec3(0, 300, 0), carBody.position);
              lastMovementTime = Date.now();
            }
          }
          
          // Update debug info
          debugInfo.textContent = `
            Velocity: ${Math.round(carBody.velocity.length() * 100) / 100} m/s
            Position: ${Math.round(carBody.position.x)}, ${Math.round(carBody.position.y)}, ${Math.round(carBody.position.z)}
            Wheels on ground: ${carBody.position.y < 2 ? "Yes" : "No"}
          `;
          
          // --- Sync ThreeJS objects with CANNON.js physics ---
          // Update car mesh position
          cube.position.copy(carBody.position);
          cube.quaternion.copy(carBody.quaternion);
          
          // Update box mesh position
          boxMesh.position.copy(boxBody.position);
          boxMesh.quaternion.copy(boxBody.quaternion);
          
          // --- Camera Follow ---
          // Position camera behind car
          const cameraOffset = new THREE.Vector3(0, 5, 15);
          const carQuaternion = new THREE.Quaternion().copy(carBody.quaternion);
          cameraOffset.applyQuaternion(carQuaternion);
          
          camera.position.set(
            carBody.position.x + cameraOffset.x,
            carBody.position.y + cameraOffset.y,
            carBody.position.z + cameraOffset.z
          );
          camera.lookAt(new THREE.Vector3(carBody.position.x, carBody.position.y, carBody.position.z));
    
          // --- Remote Players Interpolation ---
          Object.values(otherPlayers).forEach(car => {
            const target = car.userData.target;
            if (!target) return;
            car.position.lerp(new THREE.Vector3(target.x, target.y, target.z), 0.1);
            
            // If rotation is a quaternion
            if (target.rotation && target.rotation._x !== undefined) {
              car.quaternion.slerp(new THREE.Quaternion(
                target.rotation._x, 
                target.rotation._y, 
                target.rotation._z, 
                target.rotation._w
              ), 0.1);
            } else if (typeof target.rotation === 'number') {
              // If rotation is just a y-angle
              car.rotation.y += (target.rotation - car.rotation.y) * 0.1;
            }
          });
    
          // --- Update Local Player State Every 50ms ---
          if (Date.now() - lastUpdate > 50) {
            updatePlayerState();
            lastUpdate = Date.now();
          }
    
          // --- Render Scene and CSS Labels ---
          renderer.render(scene, camera);
          labelRenderer.render(scene, camera);
        }
        
        // Start everything
        registerPlayer();
        requestAnimationFrame(animate);
      });
    </script>
  </body>
</html>
